<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magma Studio</title>
    <meta
      name="description"
      content="Make a theme for Magma, the design system of Maggioli Group, from a UI: edit the colours, check every contrast as you go and preview the theme on a page of a product, in light and dark mode."
    />
    <!--
      The preview of a link to the studio on other sites (LinkedIn, chats): Open Graph, which
      Twitter reads too beside its card. The addresses are absolute, as those sites ask: the
      studio on GitHub Pages (.github/workflows/deploy-site.yml) and its cover, public/covers/,
      copied there by the build with a stable name (README.md, "Covers"). The favicons are linked
      by favicons.ts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Magma Design System" />
    <meta property="og:title" content="Magma Studio" />
    <meta
      property="og:description"
      content="Make a theme for Magma, the design system of Maggioli Group, from a UI: edit the colours, check every contrast as you go and preview the theme on a page of a product, in light and dark mode."
    />
    <meta property="og:url" content="https://magma-design-system.github.io/magma/studio/" />
    <meta
      property="og:image"
      content="https://magma-design-system.github.io/magma/studio/covers/og-1200x630.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Magma Studio, the Palette: the ramps of the primary colour of Magma in light and dark mode, all contrasts OK"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
