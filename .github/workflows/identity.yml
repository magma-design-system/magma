name: identity

on:
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1), on
  # the very commit it then lands on main: this run is the CI of that commit, and
  # nothing runs again on the push
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    uses: ./.github/workflows/_package-pipeline.yml
    with:
      path: projects/identity/**
      nx-project: identity
      artifact-paths: projects/identity/dist
      artifact-download-path: projects/identity/dist
