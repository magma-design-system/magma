name: identity

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1)
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run. A chore(release)
  # push gets its own group (no cancel, no queued-run replacement): chained
  # chore(release) pushes must each complete their CI to provide the build
  # artifact for their own publish run
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'chore(release):') && github.sha || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

jobs:
  identity:
    uses: ./.github/workflows/_package-pipeline.yml
    with:
      path: projects/identity/**
      nx-project: identity
      artifact-paths: projects/identity/dist
      artifact-download-path: projects/identity/dist
