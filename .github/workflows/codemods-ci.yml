name: codemods-ci

# Dedicated CI for @maggioli-design-system/magma-codemods, independent of the
# shared package pipeline. Runs only when the package changes.
on:
  push:
    branches: [main]
    paths:
      - 'projects/codemod/**'
      - '.github/workflows/codemods-ci.yml'
  pull_request:
    paths:
      - 'projects/codemod/**'
      - '.github/workflows/codemods-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build
        run: npx nx run codemod:build
      - name: Test
        run: npx nx run codemod:test
