name: codemods-ci

# Dedicated CI for @maggioli-design-system/magma-codemods, independent of the
# shared package pipeline. Runs only when the package changes, or the root
# package.json, package-lock.json and .nvmrc: the toolchain it builds and tests
# with (the Node version, the installed jest, ts-jest, ts-morph, typescript), as
# in the `changes` job of _package-pipeline.yml. Without them a root-only bump
# (Renovate) ran it neither on the pull request nor on main.
on:
  push:
    branches: [main]
    paths:
      - 'projects/codemod/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/codemods-ci.yml'
  pull_request:
    paths:
      - 'projects/codemod/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/codemods-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build
        run: npx nx run codemod:build
      - name: Test
        run: npx nx run codemod:test
