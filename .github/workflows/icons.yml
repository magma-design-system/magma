name: icons

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1)
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run. A chore(release)
  # push gets its own group (no cancel, no queued-run replacement): chained
  # chore(release) pushes must each complete their CI to provide the build
  # artifact for their own publish run
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'chore(release):') && github.sha || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

jobs:
  icons:
    uses: ./.github/workflows/_package-pipeline.yml
    with:
      path: projects/icons/**
      # the font is a curated subset of svg-icons: a source added there reaches the
      # font only if dictionary.json maps it, and nothing else would notice that it
      # does not (mds-icon reads svg-icons/dist directly). The prebuild check of this
      # pipeline makes that choice explicit, so new sources have to trigger it.
      extra-path: projects/svg-icons/svg/**
      nx-project: icons
      # icons build also produces svg-icons dist (nx implicit dependency)
      artifact-paths: |
        projects/icons/dist
        projects/svg-icons/dist
      artifact-download-path: projects
