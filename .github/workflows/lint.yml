# Lints every workspace project (ESLint everywhere, plus Stylelint for the
# stencil CSS) on each pull request, in the merge queue and on pushes to main.
#
# A single job runs the root `lint` script (nx run-many -t lint) instead of a
# per-package job in _package-pipeline.yml: linting the whole monorepo takes
# seconds, one status check is easier to require than seven conditional ones,
# and changes to the root ESLint/Stylelint configs are covered too. The Nx cache
# restored from the build jobs skips the projects whose inputs did not change.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1)
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline
      - run: npm run lint
