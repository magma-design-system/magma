# Lints every workspace project (ESLint everywhere, plus Stylelint for the
# stencil CSS) on each pull request and in the merge queue.
#
# A single job runs the root `lint` script (nx run-many -t lint) instead of a
# per-package job in _package-pipeline.yml: linting the whole monorepo takes
# seconds, one status check is easier to require than seven conditional ones,
# and changes to the root ESLint/Stylelint configs are covered too. The Nx cache
# of the previous run of the branch skips the projects whose inputs did not change.
name: lint

on:
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1), on
  # the very commit it then lands on main: this run is the CI of that commit, and
  # nothing runs again on the push
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nx 23 keeps the task cache and the database that indexes it in ~/.nx/<id>/,
  # shared by every checkout of the workspace: here both go under .nx, where
  # actions/cache saves and restores them together (they must move together: the
  # database rows index the cache directory)
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data
  # Nx drops the least recently used entries past this size (default: 10% of the
  # disk), so a cache restored and saved run after run stays small
  NX_MAX_CACHE_SIZE: 300MB

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-lint-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-lint-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline
      - run: npm run lint
