# Publishes the Storybook of `main` to GitHub Pages, at
# https://magma-design-system.github.io/magma/storybook/, on every push to
# `main` (a merged pull request included) that changes what the Storybook
# shows. The previous host (magma.maggiolicloud.it, .deploy/) needs a runner
# inside the Maggioli network and stopped updating with the move away from
# GitLab CI.
#
# publish.yml dispatches it after a release of svg-icons: the chore(release)
# commit is pushed with [skip ci] and the mds-icon story shows the svg-icons
# version read from its manifest.
#
# The stencil workflow built and tested the same commit in the merge queue (a
# commit landed by the queue keeps the SHA of its merge-group run), the stories
# included (test-storybook and `storybook build`, in `magma / test`): this one
# reads that run, publishes nothing when its tests failed, and reuses its
# `stencil-build` artifact. When there is no verdict (a commit pushed around the
# queue has no stencil run, or a push run that skipped or cancelled its jobs;
# an artifact expired after a day) the components are built and the stories
# tested here before publishing.
#
# A repository has a single Pages site and every deploy replaces it whole:
# Storybook lives in storybook/ and the root redirects to it, leaving room
# for the tokens playground and theme-studio (#695) next to it.
name: deploy storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Nx 23 keeps the task cache and the database that indexes it in ~/.nx/<id>/,
  # shared by every checkout of the workspace: here both go under .nx, where
  # actions/cache saves and restores them together (they must move together: the
  # database rows index the cache directory)
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data
  # Nx drops the least recently used entries past this size (default: 10% of the
  # disk), so a cache restored and saved run after run stays small
  NX_MAX_CACHE_SIZE: 300MB

permissions:
  contents: read

jobs:
  # Path filtering happens here instead of in the trigger, as in
  # _package-pipeline.yml: GitHub evaluates trigger `paths` only on the first
  # 300 files of the diff. A manual run always rebuilds, so it skips this job
  changes:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # diff against the commit before the push instead of the default branch
          base: ${{ github.ref_name }}
          filters: |
            storybook:
              - 'projects/stencil/**'
              - 'projects/design-tokens/**'
              - 'projects/styles/**'
              - 'projects/svg-icons/**'
              - 'package-lock.json'
              - '.github/workflows/deploy-storybook.yml'

  build:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    # bounds the wait for the stencil tests
    timeout-minutes: 60
    # A newer push that changes the Storybook cancels the build still running
    # for an older one. The group is set on the job rather than on the
    # workflow, so a push that changes nothing (its `changes` job skips the
    # rest) cannot cancel an older run and leave the site behind
    concurrency:
      group: ${{ github.workflow }}-build
      cancel-in-progress: true
    permissions:
      contents: read
      # read the runs of the stencil workflow and download their artifact
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - name: Wait for the stencil tests of this commit
        id: stencil
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions"
          # the latest stencil run of this commit: its merge-group run (complete
          # before the commit lands), or the push run of a commit pushed around
          # the queue; pull_request runs test the pull request head, not this commit
          RUN_ID=$(gh api "$api/workflows/stencil.yml/runs?head_sha=$SHA&per_page=100" --jq '[.workflow_runs[] | select(.event == "merge_group" or .event == "push") | .id] | max // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::notice::no stencil run for $SHA, building and testing here"
            exit 0
          fi
          # `magma / build` and `magma / test` are the jobs of the `magma` job in
          # stencil.yml. A failure stops the publication; any other outcome
          # (skipped: a push run of a commit that changes nothing under
          # projects/stencil; cancelled: a push run superseded by a newer push)
          # leaves the verdict to this job. If the jobs are renamed, the wait
          # lasts until the run ends and everything happens here
          while :; do
            RUN_STATUS=$(gh api "$api/runs/$RUN_ID" --jq '.status')
            JOBS=$(gh api "$api/runs/$RUN_ID/jobs" --jq '[.jobs[] | {(.name): "\(.status) \(.conclusion // "")"}] | add // {}')
            for JOB in build test; do
              STATE=$(jq -r --arg name "magma / $JOB" '.[$name] // ""' <<< "$JOBS")
              case "$STATE" in
                "completed failure" | "completed timed_out")
                  echo "::error::magma / $JOB of stencil run $RUN_ID failed: Storybook is not published"
                  exit 1
                  ;;
                "completed success") ;;
                # not created yet, queued or running: keep waiting
                completed*)
                  echo "::notice::magma / $JOB of stencil run $RUN_ID ended as '${STATE#completed }', building and testing here"
                  exit 0
                  ;;
              esac
            done
            [ "$(jq -r '."magma / test" // ""' <<< "$JOBS")" = "completed success" ] && break
            if [ "$RUN_STATUS" = completed ]; then
              echo "::notice::stencil run $RUN_ID ended without its build and test jobs, building and testing here"
              exit 0
            fi
            sleep 20
          done
          # a manual run on an older commit can find the artifact expired
          ARTIFACTS=$(gh api "$api/runs/$RUN_ID/artifacts?name=stencil-build" --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "$ARTIFACTS" = 0 ]; then
            echo "::notice::the stencil-build artifact of run $RUN_ID has expired, building and testing here"
            exit 0
          fi
          echo "::notice::stencil run $RUN_ID is green, reusing its stencil-build artifact"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.stencil.outputs.run-id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
          run-id: ${{ steps.stencil.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Restore Nx cache
        if: ${{ steps.stencil.outputs.run-id == '' }}
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-storybook-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-storybook-${{ hashFiles('package-lock.json') }}-
      # the preview loads the components from dist/esm/loader and serves dist
      # and assets as static files; Nx builds design-tokens, styles and
      # svg-icons first
      - if: ${{ steps.stencil.outputs.run-id == '' }}
        run: npx nx run stencil:build
      # without a green stencil run, the stories are tested here as in its
      # test job (play functions and a11y checks, Playwright Chromium)
      # the browser revision is pinned by the playwright version, read from the
      # lockfile as in _package-pipeline.yml
      - name: Read the Playwright version
        if: ${{ steps.stencil.outputs.run-id == '' }}
        id: playwright
        run: |
          echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers cache
        if: ${{ steps.stencil.outputs.run-id == '' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # no-op for the browser when cached, still installs the system libraries
      - if: ${{ steps.stencil.outputs.run-id == '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ steps.stencil.outputs.run-id == '' }}
        working-directory: projects/stencil
        run: npm run test-storybook
      - run: npx nx run stencil:storybook.build
      - name: Assemble the site
        run: |
          mkdir _site
          mv projects/stencil/dist-storybook _site/storybook
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Magma Design System</title>
              <meta http-equiv="refresh" content="0; url=storybook/">
            </head>
            <body>
              <a href="storybook/">Magma Design System Storybook</a>
            </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: [build]
    # The github-pages environment accepts deployments from main only. A job
    # without a status function in its `if` is skipped when any job before it
    # is, `changes` included, which a manual run skips: the build result is
    # checked here instead, as the build job does with `changes`
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # its own group, not the build one: an older run entering it could
    # otherwise cancel the build of a newer run. A deploy lasts seconds and
    # starts only after a full build, so deploys never run out of order; the
    # one in progress completes and the newer one follows
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}storybook/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
