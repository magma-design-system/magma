# Release pipeline for @maggioli-design-system/icons: automatic, on every
# push to main. Detects the next version from conventional commits scoped
# `icons`, bumps projects/icons/package.json (and the pins of the packages that
# depend on it, lock included), tags it and creates the GitHub release. The
# version bump commit then triggers CI -> publish.yml (npm).
#
# Stable versions ship on their own (dist-tag latest), so icon additions
# reach npm as soon as their pull request lands on main, without waiting for
# a manual release (release.yml): there icons is an idempotent no-op, the
# tag-exists guard skips what this workflow already released. A rejected push
# (another release landed on main in the meantime) is rebased and retried:
# the bump touches only this package's manifest and lock entries.
name: icons release

on:
  push:
    branches: [main]

concurrency:
  group: release-icons
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # chore(release) pushes come from release-finalize itself: their version is
    # already tagged, so re-running would only be a wasted no-op dry-run
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit
    with:
      working-directory: projects/icons
      tag-format: 'icons@${version}'
      commit-scope: icons
