name: svg-icons

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1)
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  svg-icons:
    uses: ./.github/workflows/_package-pipeline.yml
    with:
      path: projects/svg-icons/**
      nx-project: svg-icons
      artifact-paths: projects/svg-icons/dist
      artifact-download-path: projects/svg-icons/dist
