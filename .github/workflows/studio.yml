name: studio

# The studio of Magma (projects/studio, #695): an app, not a package. It runs the engine of
# design-tokens in the browser and loads its pages as a render of the MCP server does (the
# sources of mcp, on those of lint), so a change to any of them builds and tests it too.
on:
  pull_request:
  # the merge queue of main runs the checks here (docs/WORKFLOW.md, rule 1), on the very
  # commit it then lands on main
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    uses: ./.github/workflows/_package-pipeline.yml
    with:
      path: projects/studio/**
      extra-path: '{projects/design-tokens/**,projects/mcp/src/**,projects/lint/src/**}'
      nx-project: studio
      # the tests read the builds the studio stands on, as the installed packages: the logo
      # of identity, the stylesheets of styles, the loader and documentation.json of magma,
      # the mgg icons of svg-icons (the static site writes them beside its pages)
      artifact-paths: |
        projects/studio/dist
        projects/identity/dist
        projects/styles/dist
        projects/stencil/dist
        projects/svg-icons/dist
      artifact-download-path: projects
      run-tests: true
      # the static site of the studio is opened in the Playwright Chromium (test/site.test.mts)
      install-playwright-browsers: true
      test-working-directory: projects/studio

  # Guards the types of the studio (#1398): Vite and Vitest strip them, so only tsc reads them.
  # The JSX types of the mds-* tags come from the build of magma (src/shared/magma/elements.d.ts),
  # so it needs the build artifact.
  types:
    needs: [studio]
    if: ${{ needs.studio.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: studio-build
          path: projects
      - run: npx nx run studio:check.types
