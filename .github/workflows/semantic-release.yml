# Reusable semantic-release pipeline for the Magma npm monorepo.
#
# Releases one package, or a group of packages together (see release.yml).
# For each package it detects the next version from conventional commits
# (semantic-release dry-run, scoped by `commit-scope`, see
# scripts/release/semantic-release.config.cjs), writes the new versions into
# the manifests (plus any `version-sync-paths`) and pins every internal
# @maggioli-design-system/* dependency of the workspace to them, lock included
# (scripts/set-release-version.sh: e.g. a design-tokens release updates the pin
# in styles and magma), generates the release notes with git-cliff, then pushes
# ONE chore(release) commit to the triggering branch, with one tag and one
# GitHub release per package. One commit means one CI run and one publish, with
# every manifest already consistent. Publishing to npm is handled separately by
# publish.yml. The whole preparation lives in scripts/release/prepare-release.sh,
# which scripts/test-release.sh runs locally the same way.
#
# On beta nothing is committed: the tag goes on the pushed commit itself and
# publish.yml writes its version into the manifests right before publishing
# (scripts/set-release-version.sh), so beta never diverges from dev and merging
# dev into it cannot conflict on the version bumps.
#
# Uses the automatic GITHUB_TOKEN via `github.token`, so callers do NOT need
# `secrets: inherit`.
#
# Inputs:
#   - packages: JSON array of the packages released together, one object per
#     package: name, working-directory, tag-format, commit-scope and optional
#     version-sync-paths (array). Empty = the single package of the inputs below.
#   - working-directory: dir holding the package's package.json.
#   - tag-format: semantic-release tagFormat AND the git tag created
#     (e.g. 'design-tokens@${version}'); must contain ${version} exactly once.
#   - commit-scope: '|'-separated conventional-commit scope tokens (globs
#     allowed, e.g. 'magma|stencil|mds-*'); a commit drives the bump and appears
#     in the release notes when one of its scopes (`feat(a,b)` has two) matches.
#     Empty = no filtering.
#   - version-sync-paths: extra package.json files bumped to the same version
#     (e.g. companion packages kept in lockstep).
#   - stable-branches: space-separated branches allowed to release stable
#     versions. The current branch is used when listed (first entry otherwise,
#     which makes runs on unlisted branches a graceful no-op). Default 'main';
#     icons/svg-icons pass 'dev' to release directly from dev.
# The beta branch is always available as the prerelease channel.
name: Reusable Semantic Release Pipeline

on:
  workflow_call:
    inputs:
      semantic-release-version:
        type: string
        required: false
        default: '25.0.3'
      sr-commit-analyzer-version:
        type: string
        required: false
        default: '13.0.1'
      conventional-changelog-version:
        type: string
        required: false
        default: '9.1.0'
      sr-exec-version:
        type: string
        required: false
        default: '7.1.0'
      git-cliff-version:
        type: string
        required: false
        default: '2.13.1'
      packages:
        description: JSON array of the packages released together; empty = the single package of the inputs below
        type: string
        required: false
        default: ''
      working-directory:
        description: Directory holding the package manifest (version is read/written here)
        type: string
        required: false
        default: '.'
      tag-format:
        description: semantic-release tagFormat and the git tag to create; must contain ${version} once
        type: string
        required: false
        default: 'v${version}'
      commit-scope:
        description: "'|'-separated conventional-commit scope tokens (globs allowed); empty = no scope filtering"
        type: string
        required: false
        default: ''
      version-sync-paths:
        description: Extra package.json files (one per line) bumped to the same version
        type: string
        required: false
        default: ''
      stable-branches:
        description: Space-separated branches that release stable versions; the current branch is used when listed, the first entry otherwise
        type: string
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  release-check:
    name: Release Check (detect versions, bump & notes)
    runs-on: ubuntu-latest
    outputs:
      release_tags: ${{ steps.prepare.outputs.release_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch release-channel notes
        # semantic-release tracks which channel (default/beta/…) each tag was released
        # to in refs/notes/semantic-release; fetch them so the dry-run sees them.
        run: git fetch origin "refs/notes/semantic-release:refs/notes/semantic-release" 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install semantic-release (local, no-save)
        run: |
          npm install --no-save \
            semantic-release@${{ inputs.semantic-release-version }} \
            @semantic-release/commit-analyzer@${{ inputs.sr-commit-analyzer-version }} \
            @semantic-release/exec@${{ inputs.sr-exec-version }} \
            conventional-changelog-conventionalcommits@${{ inputs.conventional-changelog-version }}

      - name: Install git-cliff
        run: |
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${{ inputs.git-cliff-version }}/git-cliff-${{ inputs.git-cliff-version }}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          mv git-cliff-*/git-cliff /usr/local/bin/
          rm -rf git-cliff-*
          git-cliff --version

      - name: Detect the next versions and prepare the release
        id: prepare
        env:
          PACKAGES: ${{ inputs.packages }}
          WD: ${{ inputs.working-directory }}
          TAG_FORMAT: ${{ inputs.tag-format }}
          COMMIT_SCOPE: ${{ inputs.commit-scope }}
          SYNC_PATHS: ${{ inputs.version-sync-paths }}
          # read by scripts/release/semantic-release.config.cjs, with GITHUB_REF_NAME
          SR_STABLE_BRANCHES: ${{ inputs.stable-branches }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES" ]; then
            PACKAGES=$(jq -nc --arg wd "$WD" --arg tf "$TAG_FORMAT" --arg cs "$COMMIT_SCOPE" --arg sync "$SYNC_PATHS" \
              '[{name: ($tf | split("@")[0]), "working-directory": $wd, "tag-format": $tf, "commit-scope": $cs,
                 "version-sync-paths": ($sync | split("\n") | map(select(length > 0)))}]')
          fi
          # beta commits no bump: publish.yml applies the tag version at publish time
          APPLY=--apply
          [ "$GITHUB_REF_NAME" = beta ] && APPLY=
          ./scripts/release/prepare-release.sh $APPLY --notes "$PACKAGES"
          # the files of the release commit travel to the finalize job in the artifact
          if [ -f .release/files.txt ]; then
            while IFS= read -r f; do
              mkdir -p ".release/files/$(dirname "$f")"
              cp "$f" ".release/files/$f"
            done < .release/files.txt
          fi
          echo "release_tags=$(jq -r 'map(.tag) | join(" ")' .release/plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (plan, release files & notes)
        if: steps.prepare.outputs.release_tags != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: .release
          include-hidden-files: true

  release-finalize:
    name: Release Finalize (commit, tag, push, create releases)
    needs: release-check
    runs-on: ubuntu-latest
    if: needs.release-check.outputs.release_tags != ''
    outputs:
      tags_created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Push with a PAT/App token when provided, so the chore(release) commit triggers
          # CI -> publish (the default GITHUB_TOKEN does not trigger downstream workflows).
          # On beta only the tags and the notes are pushed: publish waits for this run instead.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Download artifacts from check
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .release

      - name: Configure git user
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Preflight checks
        env:
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          for TAG in $TAGS; do
            if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
              echo "::error::Tag ${TAG} already exists on remote"; exit 1
            fi
          done

      # beta: no version bump commit, the tags below go on the pushed commit itself
      - name: Commit the release (versions, internal pins and lock of every package)
        if: github.ref_name != 'beta'
        env:
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            cp ".release/files/$f" "$f"
            git add "$f"
          done < .release/files.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): ${TAGS}"
          fi

      - name: Push release commit (rebase-retry for concurrent pushes)
        if: github.ref_name != 'beta'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # A release run of another group (e.g. icons and svg-icons on dev) only
          # touches its own manifests and lock entries, so rebasing onto the
          # latest branch tip does not conflict.
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt $i"; exit 0
            fi
            echo "::warning::push rejected, fetching & rebasing onto origin/${BRANCH} (attempt $i)"
            git fetch origin "$BRANCH"
            git rebase "origin/${BRANCH}"
          done
          echo "::error::could not push release commit after 5 attempts"; exit 1

      - name: Create and push tags
        id: tag
        env:
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          set -euo pipefail
          REFS=()
          for TAG in $TAGS; do
            git tag -a "$TAG" -m "Release ${TAG}"
            REFS+=("refs/tags/${TAG}")
          done
          # all or nothing: a partial push would leave packages half released
          git push --atomic origin "${REFS[@]}"
          # mark that THIS run created the tags, so cleanup only rolls back its own tags
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Record release channels (git notes for prerelease continuation)
        run: |
          # Only prereleases need a channel note; stable releases use default-channel
          # inference. semantic-release maps the channel to the prerelease identifier
          # (e.g. 2.0.0-beta.1 -> "beta"); without the note it cannot continue the
          # prerelease counter and would recompute the same version (tag collision).
          set -euo pipefail
          NOTED=false
          git fetch origin "refs/notes/semantic-release:refs/notes/semantic-release" 2>/dev/null || true
          while IFS=$'\t' read -r TAG VERSION; do
            case "$VERSION" in
              *-*) ID="${VERSION#*-}"; ID="${ID%%.*}" ;;
              *) echo "${TAG}: stable release, no channel note needed"; continue ;;
            esac
            git notes --ref=semantic-release add -f -m "{\"channels\":[\"${ID}\"]}" "${TAG}^{commit}"
            NOTED=true
          done < <(jq -r '.[] | [.tag, .version] | @tsv' .release/plan.json)
          $NOTED || exit 0
          # the notes ref is shared across packages/channels: fetch-merge-retry on reject
          for i in 1 2 3 4 5; do
            if git push origin "refs/notes/semantic-release"; then
              echo "notes pushed on attempt $i"; exit 0
            fi
            echo "::warning::notes push rejected, merging remote notes (attempt $i)"
            git fetch origin "refs/notes/semantic-release:refs/notes/semantic-release-remote" 2>/dev/null || true
            git notes --ref=semantic-release merge -s cat_sort_uniq refs/notes/semantic-release-remote 2>/dev/null || true
            git update-ref -d refs/notes/semantic-release-remote 2>/dev/null || true
          done
          echo "::error::could not push semantic-release notes after retries"; exit 1

      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r NAME TAG VERSION; do
            NOTES=".release/notes/${NAME}.md"
            [ -f "$NOTES" ] || : > "$NOTES"
            # mark prereleases (versions with a -identifier) as GitHub prereleases
            case "$VERSION" in *-*) PRE=--prerelease; PREJSON=true ;; *) PRE=; PREJSON=false ;; esac
            gh release create "$TAG" $PRE --title "$TAG" --notes-file "$NOTES" || {
              BODY=$(jq -Rs . "$NOTES")
              curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":$BODY,\"prerelease\":$PREJSON}" \
                "https://api.github.com/repos/${{ github.repository }}/releases"
            }
          done < <(jq -r '.[] | [.name, .tag, .version] | @tsv' .release/plan.json)

  release-cleanup:
    name: Release Cleanup (rollback on failure)
    needs: [release-check, release-finalize]
    runs-on: ubuntu-latest
    # only roll back when THIS run actually created the tags (never delete a pre-existing release)
    if: ${{ failure() && needs.release-finalize.outputs.tags_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove tags and releases if present
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          for TAG in $TAGS; do
            git push --delete origin "$TAG" || echo "Tag $TAG not found on remote"
            gh release delete "$TAG" --yes || echo "Release $TAG not found"
          done
