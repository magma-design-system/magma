# Reusable semantic-release pipeline for the Magma npm monorepo.
#
# Releases one package, or a group of packages together (see release.yml),
# from the commit the caller runs on. For each package it detects the next
# version from conventional commits (semantic-release dry-run, scoped by
# `commit-scope`, see scripts/release/semantic-release.config.cjs), writes the
# new versions into the manifests (plus any `version-sync-paths`) and pins
# every internal @maggioli-design-system/* dependency of the workspace to them,
# lock included (scripts/set-release-version.sh: e.g. a design-tokens release
# updates the pin in styles and magma), generates the release notes with
# git-cliff, then pushes ONE chore(release) commit to the triggering branch,
# with one tag and one GitHub release per package. One commit means one CI run
# and one publish, with every manifest already consistent. Publishing to npm is
# handled separately by publish.yml. The whole preparation lives in
# scripts/release/prepare-release.sh, which scripts/test-release.sh runs
# locally the same way.
#
# Two channels (`channel` input):
#   - stable: the flow above. With `rebase-on-reject: false` (the manual
#     release of release.yml) the push is tried once: when the branch moved
#     since the commit the run started on, it fails before any tag is created
#     and the release is simply re-run. With the default `true` (the automatic
#     icons and svg-icons releases) a rejected push is rebased onto the new tip
#     and retried, as their bump touches only their own manifests.
#   - beta: a prerelease, `<next stable>-beta.N`, from the same commit, with
#     nothing committed: the tag goes on the commit itself, a channel note lets
#     semantic-release continue the counter (beta.2, beta.3 ...) and publish.yml
#     writes the tag version into the manifests right before publishing
#     (scripts/set-release-version.sh). semantic-release computes prereleases
#     on a branch named `beta`: the run creates it locally on the commit, as
#     scripts/test-release.sh does.
#
# semantic-release refuses to release a branch that is behind its remote and
# wants its release branches on that remote. A manual release works on the
# commit it was dispatched on, even after the branch moved on, so the dry-run
# is pointed at the checkout itself (SR_REPOSITORY_URL), where `main` and
# `beta` are the commit being released; the real remote is still asked
# whether the tags exist, and takes the push, the tags and the releases.
#
# The chore(release) commit, the tags and the notes are pushed with
# RELEASE_PUSH_TOKEN when the caller passes `secrets: inherit`: the default
# GITHUB_TOKEN would not trigger the CI (and so the publish) of that commit.
#
# Inputs:
#   - packages: JSON array of the packages released together, one object per
#     package: name, working-directory, tag-format, commit-scope and optional
#     version-sync-paths (array). Empty = the single package of the inputs below.
#   - packages-filter: space-separated names that narrow `packages` (e.g. the
#     magma lockstep alone on the beta channel). Empty = every package.
#   - working-directory: dir holding the package's package.json.
#   - tag-format: semantic-release tagFormat AND the git tag created
#     (e.g. 'design-tokens@${version}'); must contain ${version} exactly once.
#   - commit-scope: '|'-separated conventional-commit scope tokens (globs
#     allowed, e.g. 'magma|stencil|mds-*'); a commit drives the bump and appears
#     in the release notes when one of its scopes (`feat(a,b)` has two) matches.
#     Empty = no filtering.
#   - version-sync-paths: extra package.json files bumped to the same version
#     (e.g. companion packages kept in lockstep).
#   - stable-branches: space-separated branches allowed to release stable
#     versions. The current branch is used when listed (first entry otherwise,
#     which makes runs on unlisted branches a graceful no-op). Default 'main'.
#   - channel: 'stable' (default) or 'beta', see above.
#   - rebase-on-reject: retry a rejected push after a rebase (default true).
#   - dry-run: detect the versions and write the plan to the job summary, then
#     stop: nothing is built, committed, tagged or pushed.
name: Reusable Semantic Release Pipeline

on:
  workflow_call:
    inputs:
      semantic-release-version:
        type: string
        required: false
        default: '25.0.3'
      sr-commit-analyzer-version:
        type: string
        required: false
        default: '13.0.1'
      conventional-changelog-version:
        type: string
        required: false
        default: '9.1.0'
      sr-exec-version:
        type: string
        required: false
        default: '7.1.0'
      git-cliff-version:
        type: string
        required: false
        default: '2.13.1'
      packages:
        description: JSON array of the packages released together; empty = the single package of the inputs below
        type: string
        required: false
        default: ''
      packages-filter:
        description: Space-separated package names that narrow `packages`; empty = every package
        type: string
        required: false
        default: ''
      working-directory:
        description: Directory holding the package manifest (version is read/written here)
        type: string
        required: false
        default: '.'
      tag-format:
        description: semantic-release tagFormat and the git tag to create; must contain ${version} once
        type: string
        required: false
        default: 'v${version}'
      commit-scope:
        description: "'|'-separated conventional-commit scope tokens (globs allowed); empty = no scope filtering"
        type: string
        required: false
        default: ''
      version-sync-paths:
        description: Extra package.json files (one per line) bumped to the same version
        type: string
        required: false
        default: ''
      stable-branches:
        description: Space-separated branches that release stable versions; the current branch is used when listed, the first entry otherwise
        type: string
        required: false
        default: 'main'
      channel:
        description: "'stable' (versions committed and tagged) or 'beta' (a <next stable>-beta.N tag on the commit, nothing committed)"
        type: string
        required: false
        default: 'stable'
      rebase-on-reject:
        description: Rebase the release commit onto the new tip and retry when the push is rejected; false fails the run instead, before any tag is created
        type: boolean
        required: false
        default: true
      dry-run:
        description: Detect the versions and write the plan to the job summary, then stop
        type: boolean
        required: false
        default: false
    outputs:
      release-tags:
        description: The tags of the release plan, space-separated (empty = nothing to release)
        value: ${{ jobs.release-check.outputs.release_tags }}

permissions:
  contents: write

jobs:
  release-check:
    name: Release Check (detect versions, bump & notes)
    runs-on: ubuntu-latest
    outputs:
      release_tags: ${{ steps.prepare.outputs.release_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch release-channel notes
        # semantic-release tracks which channel (default/beta/…) each tag was released
        # to in refs/notes/semantic-release; fetch them so the dry-run sees them.
        run: git fetch origin "refs/notes/semantic-release:refs/notes/semantic-release" 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install semantic-release (local, no-save)
        run: |
          npm install --no-save \
            semantic-release@${{ inputs.semantic-release-version }} \
            @semantic-release/commit-analyzer@${{ inputs.sr-commit-analyzer-version }} \
            @semantic-release/exec@${{ inputs.sr-exec-version }} \
            conventional-changelog-conventionalcommits@${{ inputs.conventional-changelog-version }}

      - name: Install git-cliff
        run: |
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${{ inputs.git-cliff-version }}/git-cliff-${{ inputs.git-cliff-version }}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          mv git-cliff-*/git-cliff /usr/local/bin/
          rm -rf git-cliff-*
          git-cliff --version

      - name: Detect the next versions and prepare the release
        id: prepare
        env:
          PACKAGES: ${{ inputs.packages }}
          FILTER: ${{ inputs.packages-filter }}
          WD: ${{ inputs.working-directory }}
          TAG_FORMAT: ${{ inputs.tag-format }}
          COMMIT_SCOPE: ${{ inputs.commit-scope }}
          SYNC_PATHS: ${{ inputs.version-sync-paths }}
          CHANNEL: ${{ inputs.channel }}
          # read by scripts/release/semantic-release.config.cjs, with GITHUB_REF_NAME
          SR_STABLE_BRANCHES: ${{ inputs.stable-branches }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES" ]; then
            PACKAGES=$(jq -nc --arg wd "$WD" --arg tf "$TAG_FORMAT" --arg cs "$COMMIT_SCOPE" --arg sync "$SYNC_PATHS" \
              '[{name: ($tf | split("@")[0]), "working-directory": $wd, "tag-format": $tf, "commit-scope": $cs,
                 "version-sync-paths": ($sync | split("\n") | map(select(length > 0)))}]')
          fi
          if [ -n "$FILTER" ]; then
            PACKAGES=$(jq -c --arg f "$FILTER" '[.[] | select(.name as $n | $f | split(" ") | index($n))]' <<< "$PACKAGES")
          fi
          # the checkout is the remote semantic-release checks the branch
          # against (see the header): the branch being released sits on this
          # very commit there, whatever the real remote did in the meantime
          CURRENT=$(git rev-parse --abbrev-ref HEAD)
          [ "$CURRENT" = "$GITHUB_REF_NAME" ] || git checkout -q -B "$GITHUB_REF_NAME" HEAD
          export SR_REPOSITORY_URL="file://$GITHUB_WORKSPACE"
          if [ "$CHANNEL" = beta ]; then
            # a prerelease is computed on the `beta` branch: this commit, locally.
            # semantic-release reads the branch of a GitHub Actions run from
            # GITHUB_REF, so the dry-run sees beta there too
            git checkout -q -B beta HEAD
            export GITHUB_REF=refs/heads/beta GITHUB_REF_NAME=beta
            # beta commits no bump: publish.yml applies the tag version at publish time
            APPLY=
          else
            APPLY=--apply
          fi
          ./scripts/release/prepare-release.sh $APPLY --notes "$PACKAGES"
          # the files of the release commit travel to the finalize job in the artifact
          if [ -f .release/files.txt ]; then
            while IFS= read -r f; do
              mkdir -p ".release/files/$(dirname "$f")"
              cp "$f" ".release/files/$f"
            done < .release/files.txt
          fi
          echo "release_tags=$(jq -r 'map(.tag) | join(" ")' .release/plan.json)" >> "$GITHUB_OUTPUT"

      - name: Write the plan to the job summary
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "## Release plan (${CHANNEL} channel, commit ${GITHUB_SHA::9})"
            echo
            if [ "$(jq length .release/plan.json)" = 0 ]; then
              echo "Nothing to release: no package has releasable commits since its last tag."
            else
              echo "| Package | Version | Tag | Since |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| \(.name) | \(.version) | `\(.tag)` | \(."previous-tag" | if . == "" then "first release" else "`" + . + "`" end) |"' .release/plan.json
              if [ "$DRY_RUN" = true ]; then
                echo
                echo "Dry run: nothing was built, committed, tagged or pushed."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (plan, release files & notes)
        if: steps.prepare.outputs.release_tags != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: .release
          include-hidden-files: true

  release-finalize:
    name: Release Finalize (commit, tag, push, create releases)
    needs: release-check
    runs-on: ubuntu-latest
    if: needs.release-check.outputs.release_tags != '' && !inputs.dry-run
    outputs:
      tags_created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Push with a PAT/App token when provided, so the chore(release) commit triggers
          # CI -> publish (the default GITHUB_TOKEN does not trigger downstream workflows).
          # On the beta channel only the tags and the notes are pushed: publish waits for this run instead.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Download artifacts from check
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .release

      - name: Configure git user
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Preflight checks
        env:
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          for TAG in $TAGS; do
            if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
              echo "::error::Tag ${TAG} already exists on remote"; exit 1
            fi
          done

      # beta: no version bump commit, the tags below go on the commit itself
      - name: Commit the release (versions, internal pins and lock of every package)
        if: inputs.channel != 'beta'
        env:
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            cp ".release/files/$f" "$f"
            git add "$f"
          done < .release/files.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): ${TAGS}"
          fi

      - name: Push release commit
        if: inputs.channel != 'beta'
        env:
          BRANCH: ${{ github.ref_name }}
          REBASE: ${{ inputs.rebase-on-reject }}
        run: |
          if git push origin "HEAD:${BRANCH}"; then
            echo "Pushed"; exit 0
          fi
          if [ "$REBASE" != true ]; then
            # the release is bound to the commit it was dispatched on: a branch
            # that moved on gets no release commit on top of someone else's
            # merge, the run stops here and is re-run on the new tip
            TIP=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
            echo "::error::${BRANCH} moved since the dispatch (${GITHUB_SHA} -> ${TIP}): nothing was tagged, re-run the release"
            exit 1
          fi
          # A release run of another group (e.g. icons and svg-icons) only
          # touches its own manifests and lock entries, so rebasing onto the
          # latest branch tip does not conflict.
          for i in 2 3 4 5; do
            echo "::warning::push rejected, fetching & rebasing onto origin/${BRANCH} (attempt $i)"
            git fetch origin "$BRANCH"
            git rebase "origin/${BRANCH}"
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt $i"; exit 0
            fi
          done
          echo "::error::could not push release commit after 5 attempts"; exit 1

      - name: Create and push tags
        id: tag
        env:
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          set -euo pipefail
          REFS=()
          for TAG in $TAGS; do
            git tag -a "$TAG" -m "Release ${TAG}"
            REFS+=("refs/tags/${TAG}")
          done
          # all or nothing: a partial push would leave packages half released
          git push --atomic origin "${REFS[@]}"
          # mark that THIS run created the tags, so cleanup only rolls back its own tags
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Record release channels (git notes for prerelease continuation)
        run: |
          # Only prereleases need a channel note; stable releases use default-channel
          # inference. semantic-release maps the channel to the prerelease identifier
          # (e.g. 2.0.0-beta.1 -> "beta"); without the note it cannot continue the
          # prerelease counter and would recompute the same version (tag collision).
          set -euo pipefail
          NOTED=false
          git fetch origin "refs/notes/semantic-release:refs/notes/semantic-release" 2>/dev/null || true
          while IFS=$'\t' read -r TAG VERSION; do
            case "$VERSION" in
              *-*) ID="${VERSION#*-}"; ID="${ID%%.*}" ;;
              *) echo "${TAG}: stable release, no channel note needed"; continue ;;
            esac
            git notes --ref=semantic-release add -f -m "{\"channels\":[\"${ID}\"]}" "${TAG}^{commit}"
            NOTED=true
          done < <(jq -r '.[] | [.tag, .version] | @tsv' .release/plan.json)
          $NOTED || exit 0
          # the notes ref is shared across packages/channels: fetch-merge-retry on reject
          for i in 1 2 3 4 5; do
            if git push origin "refs/notes/semantic-release"; then
              echo "notes pushed on attempt $i"; exit 0
            fi
            echo "::warning::notes push rejected, merging remote notes (attempt $i)"
            git fetch origin "refs/notes/semantic-release:refs/notes/semantic-release-remote" 2>/dev/null || true
            git notes --ref=semantic-release merge -s cat_sort_uniq refs/notes/semantic-release-remote 2>/dev/null || true
            git update-ref -d refs/notes/semantic-release-remote 2>/dev/null || true
          done
          echo "::error::could not push semantic-release notes after retries"; exit 1

      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r NAME TAG VERSION; do
            NOTES=".release/notes/${NAME}.md"
            [ -f "$NOTES" ] || : > "$NOTES"
            # mark prereleases (versions with a -identifier) as GitHub prereleases
            case "$VERSION" in *-*) PRE=--prerelease; PREJSON=true ;; *) PRE=; PREJSON=false ;; esac
            gh release create "$TAG" $PRE --title "$TAG" --notes-file "$NOTES" || {
              BODY=$(jq -Rs . "$NOTES")
              curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":$BODY,\"prerelease\":$PREJSON}" \
                "https://api.github.com/repos/${{ github.repository }}/releases"
            }
          done < <(jq -r '.[] | [.name, .tag, .version] | @tsv' .release/plan.json)

  release-cleanup:
    name: Release Cleanup (rollback on failure)
    needs: [release-check, release-finalize]
    runs-on: ubuntu-latest
    # only roll back when THIS run actually created the tags (never delete a pre-existing release)
    if: ${{ failure() && needs.release-finalize.outputs.tags_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove tags and releases if present
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.release-check.outputs.release_tags }}
        run: |
          for TAG in $TAGS; do
            git push --delete origin "$TAG" || echo "Tag $TAG not found on remote"
            gh release delete "$TAG" --yes || echo "Release $TAG not found"
          done
