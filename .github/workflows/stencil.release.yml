# Prerelease pipeline for @maggioli-design-system/magma (StencilJS web
# components) on beta. Detects the next 2.0.0-beta.N version from conventional
# commits scoped to the Stencil project (magma, stencil, react, lit, storybook
# and any mds-* component). No version bump is committed: the magma@<version>
# tag goes on the pushed commit and publish.yml writes that version into the
# magma, magma-react and magma-angular manifests before publishing (keep its
# MAGMA_LOCKSTEP_MANIFESTS and the magma entry of release.yml in sync with the
# paths below). Stable magma releases come from main with the other packages
# (release.yml).
name: stencil release

on:
  push:
    branches: [beta]

concurrency:
  group: release-magma-beta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # chore(release) pushes come from release-finalize itself: their version is
    # already tagged, so re-running would only be a wasted no-op dry-run
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit
    with:
      working-directory: projects/stencil
      tag-format: 'magma@${version}'
      commit-scope: magma|stencil|react|lit|storybook|mds-*
      version-sync-paths: |
        projects/stencil-react/package.json
        projects/stencil-angular/magma-angular/package.json
