name: design-tokens

on:
  push:
    branches: [main]
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1)
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-tokens:
    uses: ./.github/workflows/_package-pipeline.yml
    with:
      path: projects/design-tokens/**
      nx-project: design-tokens
      artifact-paths: projects/design-tokens/dist
      artifact-download-path: projects/design-tokens/dist
      run-tests: true
      test-working-directory: projects/design-tokens
