name: claude-plugin-ci

# The Claude Code plugin of Magma (projects/claude-plugin, #1114): its skills are generated
# from templates and from what they list (the tools of the MCP server, the rules of the lint,
# the install guide, the codemod), so the check runs when any of those change.
on:
  push:
    branches: [main]
    paths:
      - 'projects/claude-plugin/**'
      - '.claude-plugin/**'
      - 'projects/lint/src/**'
      - 'docs/agents/**'
      - 'projects/codemod/package.json'
      - '.github/workflows/claude-plugin-ci.yml'
  pull_request:
    paths:
      - 'projects/claude-plugin/**'
      - '.claude-plugin/**'
      - 'projects/lint/src/**'
      - 'docs/agents/**'
      - 'projects/codemod/package.json'
      - '.github/workflows/claude-plugin-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Skills up to date and in the Agent Skills format
        run: npx nx run claude-plugin:check
