name: claude-plugin-ci

# The Claude Code plugin of Magma (projects/claude-plugin, #1114): its skills are generated
# from templates and from what they list (the tools of the MCP server, the rules of the lint,
# the install guide, the codemod), so the check runs when any of those change. So it does
# when the root package.json, package-lock.json or .nvmrc change: the toolchain it runs with
# (the Node version, the installed tsx and typescript that run the generator), as in the
# `changes` job of _package-pipeline.yml; without them a root-only bump (Renovate) ran it
# neither on the pull request nor on main.
on:
  push:
    branches: [main]
    paths:
      - 'projects/claude-plugin/**'
      - '.claude-plugin/**'
      - 'projects/mcp/src/**'
      - 'projects/mcp/tsconfig.json'
      - 'projects/lint/src/**'
      - 'docs/agents/**'
      - 'projects/codemod/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/claude-plugin-ci.yml'
  pull_request:
    paths:
      - 'projects/claude-plugin/**'
      - '.claude-plugin/**'
      - 'projects/mcp/src/**'
      - 'projects/mcp/tsconfig.json'
      - 'projects/lint/src/**'
      - 'docs/agents/**'
      - 'projects/codemod/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/claude-plugin-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Skills up to date and in the Agent Skills format
        run: npx nx run claude-plugin:check
