# Publishes the packages to npm, from main, once every CI workflow of the
# commit has succeeded (fan-in via workflow_run), or manually via workflow
# dispatch. A package is published only when its version is not on the npm
# registry yet.
#
# What a commit of main publishes:
#   - a chore(release) commit (the stable channel of release.yml, or the
#     automatic icons/svg-icons releases): the versions of its manifests, from
#     the build artifacts of its own CI run. Any other commit publishes nothing,
#     a manual version bump merged through a pull request included.
#   - a commit with a prerelease tag (the beta channel of release.yml: the
#     magma@x.y.z-beta.N tag, no version bump committed): the version of the
#     tag, written into the magma, magma-react and magma-angular manifests
#     right before publishing (scripts/set-release-version.sh), from the
#     lockstep artifacts the release run built. The completion of that run is
#     what triggers this workflow; the packages without a release tag are not
#     published.
#
# Authentication uses npm trusted publishing (OIDC): no NPM_TOKEN secret,
# the npm CLI exchanges the GitHub Actions OIDC token for short-lived
# credentials and attaches provenance automatically. Each package must
# have this repo + workflow registered as trusted publisher on npmjs.com.
name: publish

on:
  workflow_run:
    # `release` only matters for the beta channel, where it creates the tag the
    # version is read from and builds the artifacts (the gate ignores its runs
    # for the stable channel: the chore(release) commit it pushed has a CI of
    # its own)
    workflows: [design-tokens, icons, identity, styles, svg-icons, stencil, release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        default: all
        options:
          - all
          - design-tokens
          - icons
          - identity
          - styles
          - svg-icons
          - magma
          - magma-react
          - magma-angular
      sha:
        description: Commit to publish again (a chore(release) or beta-tagged commit of main); empty = the tip of the branch
        type: string
        default: ''

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
      run-ids: ${{ steps.check.outputs.run-ids }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check that all CI workflows of the commit are green
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          TRIGGER="${{ github.event.workflow_run.name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.sha || github.sha }}"
            if [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ inputs.package }}" = "all" ]; then
              echo "::error::manual publish from a branch other than main requires a specific package"
              exit 1
            fi
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::warning::workflow '$TRIGGER' did not succeed, skipping publish"
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # a CI completion publishes the release commits only: every other
            # commit of main (a merged pull request, a manual version bump)
            # has nothing to ship
            if [ "$TRIGGER" != "release" ] && \
               ! printf '%s\n' "$HEAD_MESSAGE" | head -n 1 | grep -q '^chore(release):'; then
              echo "::notice::$SHA is not a chore(release) commit, nothing to publish"
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # a magma prerelease tag on the commit: the beta channel, whose version
          # is the tag and whose lockstep artifacts come from the release run. An
          # annotated tag is listed twice: as the tag object and, peeled with
          # ^{}, as the commit it points to
          PRERELEASE=$(git ls-remote --tags "$REPO_URL" 'refs/tags/magma@*-*' \
            | awk -v sha="$SHA" '$1 == sha { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' | sort -u)
          if [ -n "$PRERELEASE" ]; then
            echo "prerelease tags on $SHA: $(echo "$PRERELEASE" | tr '\n' ' ')"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "$TRIGGER" = "release" ]; then
            echo "::notice::stable release: the CI of its chore(release) commit publishes it, nothing to do here"
            exit 0
          fi
          # latest push or merge-queue run of each watched CI workflow for this
          # commit (allowlist in lockstep with on.workflow_run.workflows above,
          # `release` apart). Both events build the artifacts; a commit landed by
          # the merge queue keeps the SHA of its merge-group run. pull_request
          # runs are excluded: they produce no artifacts. The other workflows
          # are excluded: their completion does not re-trigger publish, so
          # waiting on one still in progress would lose the publish.
          WATCHED='["design-tokens", "icons", "identity", "styles", "svg-icons", "stencil"]'
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
            | jq --argjson watched "$WATCHED" '[.workflow_runs[] | select((.event == "push" or .event == "merge_group") and (.name as $n | $watched | index($n)))] | group_by(.name) | map(max_by(.id))')
          echo "$RUNS" | jq -r '.[] | "\(.name): \(.status) (\(.conclusion))"'
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            FAILED=$(echo "$RUNS" | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')
            if [ "$PENDING" -gt 0 ]; then
              if [ "$TRIGGER" = "release" ]; then
                echo "::warning::$PENDING CI workflow(s) of $SHA still running: run publish by hand with sha=$SHA once they are green"
              else
                echo "::notice::$PENDING CI workflow(s) still running, the last one to finish will re-run this check"
              fi
              exit 0
            fi
            if [ "$FAILED" -gt 0 ]; then
              echo "::warning::$FAILED CI workflow(s) did not succeed, skipping publish"
              exit 0
            fi
          fi
          RUN_IDS=$(echo "$RUNS" | jq -c 'map({(.name): .id}) | add // {}')
          if [ -n "$PRERELEASE" ]; then
            # the lockstep artifacts of a beta come from the release run that
            # tagged the commit: the triggering one, or the latest green one of
            # the commit on a manual publish
            if [ "$TRIGGER" = "release" ]; then
              RELEASE_RUN="${{ github.event.workflow_run.id }}"
            else
              RELEASE_RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?head_sha=$SHA&status=success&per_page=100" \
                --jq '[.workflow_runs[].id] | max // empty')
            fi
            if [ -z "$RELEASE_RUN" ]; then
              echo "::error::no successful release run of $SHA to take the lockstep artifacts from"
              exit 1
            fi
            RUN_IDS=$(echo "$RUN_IDS" | jq -c --argjson id "$RELEASE_RUN" '. + {stencil: $id}')
          fi
          echo "run-ids=$RUN_IDS" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [gate]
    if: ${{ needs.gate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read # checkout
      actions: read # download build artifacts from the CI and release runs
    env:
      # released in lockstep under the magma@* tag: the same set as the
      # working-directory + version-sync-paths of the magma entry of release.yml
      MAGMA_LOCKSTEP_MANIFESTS: >-
        projects/stencil/package.json
        projects/stencil-react/package.json
        projects/stencil-angular/magma-angular/package.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: design-tokens
            directory: projects/design-tokens
            workflow: design-tokens
            artifact: design-tokens-build
            artifact-path: projects/design-tokens/dist
          - component: icons
            directory: projects/icons
            workflow: icons
            artifact: icons-build
            artifact-path: projects
          - component: identity
            directory: projects/identity
            workflow: identity
            artifact: identity-build
            artifact-path: projects/identity/dist
          - component: styles
            directory: projects/styles
            workflow: styles
            artifact: styles-build
            artifact-path: projects
          - component: svg-icons
            directory: projects/svg-icons
            workflow: svg-icons
            artifact: svg-icons-build
            artifact-path: projects/svg-icons/dist
          - component: magma
            directory: projects/stencil
            workflow: stencil
            artifact: stencil-build
            artifact-path: projects
            # on the beta channel the version comes from the magma@* tag on the commit
            release-tag: magma
          - component: magma-react
            directory: projects/stencil-react
            workflow: stencil
            artifact: stencil-react-build
            # dist plus the agent docs, rooted at the package directory
            artifact-path: projects/stencil-react
            release-tag: magma
          - component: magma-angular
            # publishes from the build output (ng-packagr layout), so the
            # version is read from the source package.json
            directory: projects/stencil-angular/dist/magma-angular
            version-file: projects/stencil-angular/magma-angular/package.json
            workflow: stencil
            artifact: stencil-angular-build
            artifact-path: projects/stencil-angular/dist
            release-tag: magma
    concurrency: publish-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Check whether a new version needs publishing
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.package }}" != "all" ] && [ "${{ inputs.package }}" != "${{ matrix.component }}" ]; then
            echo "::notice::${{ matrix.component }} not selected, skipping"
            exit 0
          fi
          # a prerelease tag of the package on the commit (the beta channel
          # commits no version bump) is the version; otherwise the manifest is.
          # An annotated tag is listed twice: as the tag object and, peeled
          # with ^{}, as the commit it points to
          RELEASE_TAG=
          if [ -n "${{ matrix.release-tag }}" ]; then
            RELEASE_TAG=$(git ls-remote --tags origin "refs/tags/${{ matrix.release-tag }}@*-*" \
              | awk -v sha="${{ needs.gate.outputs.sha }}" '$1 == sha { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' \
              | sort -u | tail -n 1)
          fi
          if [ -n "$RELEASE_TAG" ]; then
            TO_BE_PUBLISHED_V="${RELEASE_TAG##*@}"
            echo "release-version=$TO_BE_PUBLISHED_V" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.gate.outputs.prerelease }}" = "true" ]; then
            echo "::notice::no ${{ matrix.release-tag || matrix.component }}@* prerelease tag on ${{ needs.gate.outputs.sha }}, skipping"
            exit 0
          else
            TO_BE_PUBLISHED_V="$(jq -r '.version' "${{ matrix.version-file || format('{0}/package.json', matrix.directory) }}")"
          fi
          echo "VERSION TO BE PUBLISHED ${TO_BE_PUBLISHED_V}"
          # npm view of a missing version exits 0 with empty output, so test the output
          PUBLISHED="$(npm view "@maggioli-design-system/${{ matrix.component }}@${TO_BE_PUBLISHED_V}" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "::notice::@maggioli-design-system/${{ matrix.component }}@${TO_BE_PUBLISHED_V} already published, skipping"
            exit 0
          fi
          # A version can be missing from npm without a fresh build to publish
          # (a chore(release) push where its build was path-filtered out):
          # skip with a warning instead of failing the artifact download.
          RUN_ID='${{ fromJSON(needs.gate.outputs.run-ids)[matrix.workflow] }}'
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::warning::${{ matrix.component }}@${TO_BE_PUBLISHED_V} is not on npm but the '${{ matrix.workflow }}' workflow has no run for this commit, skipping"
            exit 0
          fi
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?name=${{ matrix.artifact }}" --jq '.total_count')
          if [ "$ARTIFACTS" = "0" ]; then
            echo "::warning::${{ matrix.component }}@${TO_BE_PUBLISHED_V} is not on npm but run ${RUN_ID} produced no '${{ matrix.artifact }}' artifact, skipping"
            exit 0
          fi
          # dist-tag from the semver prerelease identifier: 2.0.0-alpha.0 -> alpha,
          # non-alphabetic identifier -> next, stable -> latest
          case "$TO_BE_PUBLISHED_V" in
            *-*)
              TAG="${TO_BE_PUBLISHED_V#*-}"
              TAG="${TAG%%.*}"
              case "$TAG" in ''|*[!a-zA-Z]*) TAG=next ;; esac
              ;;
            *) TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.ver.outputs.proceed == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ steps.ver.outputs.proceed == 'true' }}
        run: npm ci --prefer-offline
      - name: Download the build artifact from the CI or release run
        if: ${{ steps.ver.outputs.proceed == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          run-id: ${{ fromJSON(needs.gate.outputs.run-ids)[matrix.workflow] }}
          github-token: ${{ github.token }}
      - name: Write the release tag version into the manifests (beta channel)
        if: ${{ steps.ver.outputs.proceed == 'true' && steps.ver.outputs.release-version != '' }}
        env:
          V: ${{ steps.ver.outputs.release-version }}
          MANIFEST: ${{ matrix.directory }}/package.json
        run: |
          if [ "$(jq -r '.version' "$MANIFEST")" = "$V" ]; then
            echo "$MANIFEST already at $V"
            exit 0
          fi
          # the lockstep sources first, so every companion pins magma to $V, then
          # the published manifest itself (the ng-packagr output for magma-angular)
          # shellcheck disable=SC2086 # the list is split on purpose
          ./scripts/set-release-version.sh "$V" $MAGMA_LOCKSTEP_MANIFESTS "$MANIFEST"
      - name: Check that the agent docs and the changelog are in the tarball
        if: ${{ steps.ver.outputs.proceed == 'true' && matrix.release-tag == 'magma' }}
        working-directory: ${{ matrix.directory }}
        run: |
          # npm skips the `files` entries that do not exist without a warning,
          # so a path missing from the artifact would publish silently (#809)
          FILES=$(npm pack --dry-run --json | jq -r '.[0].files[].path')
          echo "$FILES" | grep -qx 'AGENTS.md' || { echo "::error::AGENTS.md is missing from the ${{ matrix.component }} tarball"; exit 1; }
          echo "$FILES" | grep -q '^agents/.*[.]md$' || { echo "::error::agents/*.md is missing from the ${{ matrix.component }} tarball"; exit 1; }
          echo "$FILES" | grep -qx 'CHANGELOG.md' || { echo "::error::CHANGELOG.md is missing from the ${{ matrix.component }} tarball"; exit 1; }
          # with an exports map, a file in the tarball resolves only when it is exported (#981);
          # for magma-angular this is the manifest ng-packagr wrote, merged with its own exports
          jq -e '.exports["./CHANGELOG.md"]' package.json > /dev/null || { echo "::error::${{ matrix.component }} does not export ./CHANGELOG.md"; exit 1; }
      - name: Publish to npm
        if: ${{ steps.ver.outputs.proceed == 'true' }}
        working-directory: ${{ matrix.directory }}
        run: npm publish --access public --tag "${{ steps.ver.outputs.tag }}"
