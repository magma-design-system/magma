# The release and the npm publish of every package, from main, in one run.
#
# A maintainer starts it with "Run workflow" on the main branch (docs/WORKFLOW.md
# rule 1). It works on the commit main pointed to when it was dispatched,
# whatever lands on main while it runs, through these jobs:
#
#   guard     the dispatch is on main (a dry-run runs anywhere), the beta
#             channel is asked for magma only and `tag` is not a dry-run
#   packages  the packages of `package` (all, or one of them; magma is the
#             lockstep magma, magma-react and magma-angular), or of `tag` (the
#             package of the tag, with the commit it points to), and a check
#             that the CI of the commit is green
#   plan      the next version of each package (a semantic-release dry-run),
#             written to the job summary BEFORE the approval, so whoever
#             approves sees what is about to ship
#   approve   the `release` environment (its required reviewers). Approve it
#             right away: on the stable channel the time spent waiting is time
#             for main to move and the push to be rejected
#   release   semantic-release.yml.
#             channel stable: one chore(release) commit with the next version
#             of each package (from the conventional commits of its scope), the
#             pins of the packages that depend on it (e.g. design-tokens ->
#             styles and magma, magma -> magma-react and magma-angular), the
#             lock and the CHANGELOG.md sections, pushed straight to main with
#             RELEASE_PUSH_TOKEN, then one tag and one GitHub release per
#             package. The push is not rebased: when main moved since the
#             dispatch it is rejected, the run fails before any tag exists and
#             is re-run.
#             channel beta: a magma prerelease, magma@<next stable>-beta.N,
#             with nothing committed: the tag goes on the dispatched commit. A
#             second beta without a new stable in between is beta.N+1
#             (semantic-release channel notes).
#   storybook the Storybook deploy of the release commit, when svg-icons was
#             released: the mds-icon story shows its version, and the release
#             commit, pushed with [skip ci], runs no deploy of its own
#   publish   checks out the release commit (the dispatched one on the beta
#             channel, or when nothing was released; the one of `tag`), builds
#             the selected packages and publishes every one of them whose
#             version is not on the npm registry yet, with the dist-tag of its
#             version (latest, beta). On the beta channel the tag version is
#             written into the lockstep manifests right before publishing
#             (scripts/set-release-version.sh). The packages go in dependency
#             order, and one whose dependency (from its manifest) failed to
#             publish in the same run is not published: design-tokens and
#             styles for magma, magma for magma-react and magma-angular.
#
# The CI of the chore(release) commit runs on its push too (the release token
# triggers it, with the Storybook deploy) but is not awaited: the dispatched
# commit was tested by its own CI, which the packages job checks, and the
# release commit only adds versions, pins, lock and changelogs on top of it.
#
# dry-run: the plan alone, in the job summary, with no approval needed. It may
# be dispatched on any branch: the plan is then what that branch would release
# (semantic-release treats it as the stable branch, since main is not a local
# branch of the checkout it is pointed at).
#
# Publishing again: a dispatch on the tip of main that finds nothing to release
# publishes the manifest versions missing from npm (a failed stable publish; a
# version bumped by hand through a pull request ships this way too, and only
# this way). Once main has moved past a release with commits that would
# release again, the `tag` input publishes that release instead: the run,
# dispatched on main as usual, releases nothing, checks out the commit the tag
# points to after the approval and publishes the packages of the tag missing
# from npm at its version (magma@2.4.1: magma, magma-react and magma-angular
# 2.4.1; a magma@x.y.z-beta.N tag: its beta). `package` and `channel` come
# from the tag. The dispatch stays on main because a run uses the workflow
# file of the ref it is dispatched on: dispatched on the tag itself, it would
# run the workflow of that commit, not this one. A failed beta publish is also
# re-run from its own run ("Re-run failed jobs"): the version is the tag that
# run created.
#
# icons and svg-icons also release on their own, on every push to main (the
# `push` trigger): the same chain limited to the two of them, without approval,
# so icon additions reach npm as soon as their pull request lands. A push
# rejected by another release commit is rebased and retried, as their bump
# touches only their own manifests. A dispatched release then usually finds
# nothing left to do for them.
#
# Authentication uses npm trusted publishing (OIDC): no NPM_TOKEN secret, the
# npm CLI exchanges the GitHub Actions OIDC token for short-lived credentials
# and attaches provenance automatically. Each package must have this repo +
# this workflow file registered as trusted publisher on npmjs.com.
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release and publish (magma = magma, magma-react and magma-angular)
        type: choice
        default: all
        options:
          - all
          - design-tokens
          - identity
          - styles
          - svg-icons
          - icons
          - magma
      channel:
        description: stable = versions committed on main and tagged; beta = magma@x.y.z-beta.N tag on the commit, nothing committed
        type: choice
        default: stable
        options:
          - stable
          - beta
      dry-run:
        description: Only compute the plan (job summary), without approval, commit, tag, push, build or publish
        type: boolean
        default: false
      tag:
        description: Publish an existing release again, e.g. magma@2.4.1 (nothing is released; package and channel come from the tag, no dry-run)
        type: string
        default: ''
  push:
    branches: [main]

# a dispatched release and the automatic icon releases do not wait for each
# other: when both push a release commit, the push run rebases and retries, the
# dispatched run fails before any tag and is re-run
concurrency:
  group: publish-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

# magma's manifests: keep the magma entry in sync with MAGMA_LOCKSTEP_MANIFESTS
# and NPM_PACKAGES below. The list is parsed by scripts/test-release.sh and
# projects/stencil/scripts/pr-risk.ts: keep its layout (one package per `{`,
# the `packages: >-` block scalar) and keep it the first list of this file
# (pr-risk.ts reads the commit-scope after the first "name": "magma").
env:
  PACKAGES: >-
    [
      {"name": "design-tokens", "working-directory": "projects/design-tokens",
       "tag-format": "design-tokens@${version}", "commit-scope": "design-tokens"},
      {"name": "identity", "working-directory": "projects/identity",
       "tag-format": "identity@${version}", "commit-scope": "identity"},
      {"name": "styles", "working-directory": "projects/styles",
       "tag-format": "styles@${version}", "commit-scope": "styles"},
      {"name": "svg-icons", "working-directory": "projects/svg-icons",
       "tag-format": "svg-icons@${version}", "commit-scope": "svg-icons"},
      {"name": "icons", "working-directory": "projects/icons",
       "tag-format": "icons@${version}", "commit-scope": "icons"},
      {"name": "magma", "working-directory": "projects/stencil",
       "tag-format": "magma@${version}", "commit-scope": "magma|stencil|react|lit|storybook|lint|mds-*",
       "version-sync-paths": ["projects/stencil-react/package.json",
                              "projects/stencil-angular/magma-angular/package.json"]}
    ]
  # the npm packages: the entry of PACKAGES they are released under (`release`:
  # the magma lockstep shares one tag), the directory `npm publish` runs in,
  # the manifest the version is read from when it is not the one of that
  # directory, and the Nx project that builds them. Dependencies first.
  NPM_PACKAGES: >-
    [
      {"name": "design-tokens", "release": "design-tokens", "directory": "projects/design-tokens",
       "nx-project": "design-tokens"},
      {"name": "identity", "release": "identity", "directory": "projects/identity",
       "nx-project": "identity"},
      {"name": "styles", "release": "styles", "directory": "projects/styles",
       "nx-project": "styles"},
      {"name": "svg-icons", "release": "svg-icons", "directory": "projects/svg-icons",
       "nx-project": "svg-icons"},
      {"name": "icons", "release": "icons", "directory": "projects/icons",
       "nx-project": "icons"},
      {"name": "magma", "release": "magma", "directory": "projects/stencil",
       "nx-project": "stencil"},
      {"name": "magma-react", "release": "magma", "directory": "projects/stencil-react",
       "nx-project": "stencil-react"},
      {"name": "magma-angular", "release": "magma", "directory": "projects/stencil-angular/dist/magma-angular",
       "version-file": "projects/stencil-angular/magma-angular/package.json", "nx-project": "stencil-angular"}
    ]
  # released in lockstep under the magma@* tag: the same set as the
  # working-directory + version-sync-paths of the magma entry of PACKAGES
  MAGMA_LOCKSTEP_MANIFESTS: >-
    projects/stencil/package.json
    projects/stencil-react/package.json
    projects/stencil-angular/magma-angular/package.json

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.ref_name }}" != main ] && [ "${{ inputs.dry-run }}" != true ]; then
            echo "::error::a release runs on main only (dispatched on ${{ github.ref_name }}); a dry-run runs on any branch"
            exit 1
          fi
          if [ -n "$TAG" ]; then
            # an existing release: no plan to show, package and channel are the tag's
            if [ "${{ inputs.dry-run }}" = true ]; then
              echo "::error::a tag publishes an existing release again, there is no plan to dry-run ($TAG)"
              exit 1
            fi
          elif [ "${{ inputs.channel }}" = beta ] && [ "${{ inputs.package }}" != all ] && [ "${{ inputs.package }}" != magma ]; then
            echo "::error::the beta channel releases magma only (package: ${{ inputs.package }})"
            exit 1
          fi
      - if: ${{ github.event_name == 'push' }}
        run: echo "push to main, the automatic release of icons and svg-icons"

  # a reusable workflow cannot read `env`: the packages list goes through an
  # output of this job, with the filter and the channel of this run
  packages:
    needs: [guard]
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      filter: ${{ steps.list.outputs.filter }}
      channel: ${{ steps.list.outputs.channel }}
      # the commit the run works on: the one of `tag`, the dispatched or pushed one otherwise
      sha: ${{ steps.list.outputs.sha }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo 'list<<EOF'
            echo "$PACKAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          SHA="${{ github.sha }}"
          if [ "${{ github.event_name }}" = push ]; then
            FILTER='icons svg-icons'; CHANNEL=stable
          elif [ -n "$TAG" ]; then
            # an existing release: the package of the tag (<package>@<version>,
            # the magma lockstep for magma@*), the channel of its version (a
            # prerelease is a beta) and the commit it points to
            FILTER="${TAG%@*}"
            case "${TAG##*@}" in *-*) CHANNEL=beta ;; *) CHANNEL=stable ;; esac
            if [ "$FILTER" = "$TAG" ] || ! jq -e --arg n "$FILTER" 'any(.[]; .name == $n)' <<< "$PACKAGES" > /dev/null; then
              echo "::error::$TAG is not a release tag of this file (<package>@<version>, the package one of $(jq -r 'map(.name) | join(", ")' <<< "$PACKAGES"))"
              exit 1
            fi
            REF=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" 2> /dev/null) || {
              echo "::error::no tag $TAG in ${{ github.repository }}"
              exit 1
            }
            SHA=$(jq -r '.object.sha' <<< "$REF")
            # an annotated tag points to a tag object: take its commit
            if [ "$(jq -r '.object.type' <<< "$REF")" = tag ]; then
              SHA=$(gh api "repos/${{ github.repository }}/git/tags/$SHA" --jq '.object.sha')
            fi
            echo "::notice::$TAG is $SHA: its release is published again, nothing is released"
          elif [ "${{ inputs.channel }}" = beta ]; then
            FILTER=magma; CHANNEL=beta
          elif [ "${{ inputs.package }}" = all ]; then
            FILTER=; CHANNEL=stable
          else
            FILTER="${{ inputs.package }}"; CHANNEL=stable
          fi
          echo "packages: ${FILTER:-all} ($CHANNEL channel)"
          {
            echo "filter=$FILTER"
            echo "channel=$CHANNEL"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Check that the CI of the commit is green
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          # the dispatched commit, or the one of `tag`
          START: ${{ steps.list.outputs.sha }}
        run: |
          # the latest push or merge-queue run of each CI workflow of this
          # commit (a commit landed by the merge queue keeps the SHA of its
          # merge-group run); pull_request runs test the pull request head,
          # not this commit
          WATCHED='["design-tokens", "icons", "identity", "styles", "svg-icons", "stencil", "lint"]'
          # a chore(release) commit is pushed with [skip ci] and has no CI of its
          # own: the code it versions is its parent's, so that is the commit to
          # check (walking past chained release commits)
          SHA="$START"
          for _ in 1 2 3 4 5; do
            COMMIT=$(gh api "repos/${{ github.repository }}/commits/$SHA")
            case "$(jq -r '.commit.message | split("\n")[0]' <<< "$COMMIT")" in
              'chore(release):'*) SHA=$(jq -r '.parents[0].sha' <<< "$COMMIT") ;;
              *) break ;;
            esac
          done
          if [ "$SHA" != "$START" ]; then
            echo "::notice::$START is a chore(release) commit: checking the CI of $SHA, the commit it versions"
          fi
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
            | jq --argjson watched "$WATCHED" '[.workflow_runs[] | select((.event == "push" or .event == "merge_group") and (.name as $n | $watched | index($n)))] | group_by(.name) | map(max_by(.id))')
          echo "$RUNS" | jq -r '.[] | "\(.name): \(.status) (\(.conclusion))"'
          if [ "$(echo "$RUNS" | jq length)" = 0 ]; then
            echo "::warning::no CI run of $SHA: releasing a commit without a CI of its own"
            exit 0
          fi
          PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
          FAILED=$(echo "$RUNS" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")] | length')
          if [ "$PENDING" -gt 0 ]; then
            echo "::error::$PENDING CI workflow(s) of $SHA still running: dispatch again once they are green"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED CI workflow(s) of $SHA did not succeed: a red check is never bypassed (docs/WORKFLOW.md rule 1)"
            exit 1
          fi

  # the plan of every dispatch, before the approval; a dry-run stops here. A
  # tag releases nothing: no plan
  plan:
    needs: [packages]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.tag }}
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit
    with:
      packages: ${{ needs.packages.outputs.list }}
      packages-filter: ${{ needs.packages.outputs.filter }}
      channel: ${{ needs.packages.outputs.channel }}
      # main on main; on a dry-run from another branch, that branch (see the header)
      stable-branches: ${{ github.ref_name }}
      dry-run: true

  approve:
    name: Approve the release
    needs: [packages, plan]
    # the plan is skipped by a tag
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.dry-run &&
          needs.packages.result == 'success' &&
          (needs.plan.result == 'success' || (inputs.tag && needs.plan.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          TAGS: ${{ needs.plan.outputs.release-tags }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "publish of the $TAG release (${{ needs.packages.outputs.sha }}) approved: its versions missing from npm are published"
          else
            echo "${{ inputs.channel }} release of ${{ github.sha }} approved: ${TAGS:-nothing to release, the versions missing from npm are published}"
          fi

  release:
    needs: [packages, approve]
    # the approval is skipped by the push trigger (the automatic icon
    # releases); a tag releases nothing
    if: >-
      ${{ !cancelled() && needs.packages.result == 'success' && !inputs.tag &&
          (needs.approve.result == 'success' || (github.event_name == 'push' && needs.approve.result == 'skipped')) }}
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit
    with:
      packages: ${{ needs.packages.outputs.list }}
      packages-filter: ${{ needs.packages.outputs.filter }}
      channel: ${{ needs.packages.outputs.channel }}
      # a dispatched release is bound to the commit it was dispatched on; the
      # automatic icon releases rebase onto whatever landed on main meanwhile
      rebase-on-reject: ${{ github.event_name == 'push' }}

  storybook:
    needs: [release]
    # the chore(release) commit is pushed with [skip ci], so the push of a
    # release runs no Storybook deploy; the mds-icon story shows the version
    # of svg-icons read from its manifest, so a release of svg-icons deploys
    # the Storybook of the release commit on request (a beta releases magma
    # only). The deploy builds and tests the commit itself, there being no
    # stencil run of it, and its build supersedes the one of the parent push
    if: ${{ !cancelled() && needs.release.result == 'success' && contains(needs.release.outputs.release-tags, 'svg-icons@') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # the workflow_dispatch of deploy-storybook.yml
    steps:
      - name: Dispatch the Storybook deploy of the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-storybook.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  publish:
    needs: [packages, approve, release]
    # a dispatch publishes what is missing from npm even when nothing was
    # released; a push builds only when it released something; a tag skips
    # the release and publishes once approved
    if: >-
      ${{ !cancelled() && needs.packages.result == 'success' &&
          ((needs.release.result == 'success' &&
            (github.event_name == 'workflow_dispatch' || needs.release.outputs.release-sha != '')) ||
           (inputs.tag && needs.release.result == 'skipped' && needs.approve.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read # checkout
    steps:
      - uses: actions/checkout@v7
        with:
          # the release commit; the dispatched one on the beta channel and when
          # nothing was released; the one of `tag`
          ref: ${{ needs.release.outputs.release-sha || needs.packages.outputs.sha }}
      - name: Select the packages whose version is not on npm
        id: select
        env:
          FILTER: ${{ needs.packages.outputs.filter }}
          # the tags of this run's release, or the one published again
          TAGS: ${{ needs.release.outputs.release-tags || inputs.tag }}
          CHANNEL: ${{ needs.packages.outputs.channel }}
        run: |
          set -euo pipefail
          SELECTED=$(jq -c --arg f "$FILTER" '[.[] | select($f == "" or (.release as $r | $f | split(" ") | index($r)))]' <<< "$NPM_PACKAGES")
          TO_PUBLISH='[]'
          while IFS=$'\t' read -r name release version_file; do
            # the version is the tag this run created for the package, or the
            # one published again (the beta channel bumps no manifest), the
            # manifest otherwise
            v=
            for t in $TAGS; do
              [ "${t%@*}" = "$release" ] && v="${t##*@}"
            done
            if [ -z "$v" ]; then
              if [ "$CHANNEL" = beta ]; then
                echo "::notice::no $release@* prerelease tag in this run, skipping $name"
                continue
              fi
              v=$(jq -r '.version' "$version_file")
            fi
            # npm view of a missing version exits 0 with empty output, so test the output
            if [ -n "$(npm view "@maggioli-design-system/$name@$v" version 2>/dev/null || true)" ]; then
              echo "::notice::@maggioli-design-system/$name@$v already published, skipping"
              continue
            fi
            # dist-tag from the semver prerelease identifier: 2.0.0-beta.1 -> beta,
            # non-alphabetic identifier -> next, stable -> latest
            case "$v" in
              *-*)
                tag="${v#*-}"
                tag="${tag%%.*}"
                case "$tag" in ''|*[!a-zA-Z]*) tag=next ;; esac
                ;;
              *) tag=latest ;;
            esac
            echo "$name@$v to be published with the dist-tag $tag"
            TO_PUBLISH=$(jq -c --arg n "$name" --arg v "$v" --arg t "$tag" '. + [$pkg[] | select(.name == $n) | . + {version: $v, "dist-tag": $t}]' --argjson pkg "$SELECTED" <<< "$TO_PUBLISH")
          done < <(jq -r '.[] | [.name, .release, (."version-file" // (.directory + "/package.json"))] | @tsv' <<< "$SELECTED")
          [ "$TO_PUBLISH" = '[]' ] && echo "::notice::every selected package is on npm already, nothing to publish"
          echo "to-publish=$TO_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "projects=$(jq -r 'map(."nx-project") | unique | join(" ")' <<< "$TO_PUBLISH")" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.select.outputs.to-publish != '[]' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Nx cache
        if: ${{ steps.select.outputs.to-publish != '[]' }}
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ hashFiles('package-lock.json') }}-
      - if: ${{ steps.select.outputs.to-publish != '[]' }}
        run: npm ci --prefer-offline
      # Nx builds design-tokens, styles and svg-icons first when a package needs them
      - name: Build the packages
        if: ${{ steps.select.outputs.to-publish != '[]' }}
        run: npx nx run-many -t build -p ${{ steps.select.outputs.projects }}
      - name: Publish to npm
        if: ${{ steps.select.outputs.to-publish != '[]' }}
        env:
          TO_PUBLISH: ${{ steps.select.outputs.to-publish }}
          CHANNEL: ${{ needs.packages.outputs.channel }}
        run: |
          set -uo pipefail
          # <name> <release> <directory> <version> <dist-tag>: publishes one
          # package; exit 1 when a check or the publish fails
          publish_one() {
            local name="$1" release="$2" dir="$3" v="$4" tag="$5"
            if [ "$CHANNEL" = beta ] && [ "$(jq -r '.version' "$dir/package.json")" != "$v" ]; then
              # the lockstep sources first, so every companion pins magma to $v,
              # then the published manifest itself (the ng-packagr output for
              # magma-angular)
              # shellcheck disable=SC2086 # the list is split on purpose
              ./scripts/set-release-version.sh "$v" $MAGMA_LOCKSTEP_MANIFESTS "$dir/package.json" || return 1
            fi
            if [ "$release" = magma ]; then
              # with an exports map, a file in the tarball resolves only when it is
              # exported (#981); for magma-angular this is the manifest ng-packagr
              # wrote, merged with its own exports
              jq -e '.exports["./CHANGELOG.md"]' "$dir/package.json" > /dev/null || { echo "::error::$name does not export ./CHANGELOG.md"; return 1; }
            fi
            (cd "$dir" && npm publish --access public --tag "$tag")
          }
          # the internal dependencies of each package among the packages of
          # this run (dependencies, peerDependencies and optionalDependencies
          # on @maggioli-design-system/*, read from the manifest published):
          # a package is published after them, and not at all when one of
          # them failed, so nothing on npm ever requires a version that is
          # not there (design-tokens and styles for magma; magma for
          # magma-react and magma-angular, which pin it at the exact version).
          # A dependency already on npm is not in the list and blocks nothing
          declare -A PKG_DIR PKG_RELEASE PKG_VERSION PKG_TAG PKG_DEPS
          NAMES=()
          while IFS=$'\t' read -r name release dir v tag; do
            NAMES+=("$name"); PKG_DIR[$name]=$dir; PKG_RELEASE[$name]=$release; PKG_VERSION[$name]=$v; PKG_TAG[$name]=$tag
          done < <(jq -r '.[] | [.name, .release, .directory, .version, ."dist-tag"] | @tsv' <<< "$TO_PUBLISH")
          for name in "${NAMES[@]}"; do
            PKG_DEPS[$name]=$(jq -r --argjson names "$(jq -c '[.[].name]' <<< "$TO_PUBLISH")" \
              '[.dependencies, .peerDependencies, .optionalDependencies] | map(. // {}) | add | keys[]
               | select(startswith("@maggioli-design-system/")) | ltrimstr("@maggioli-design-system/")
               | select(. as $d | $names | index($d) != null)' "${PKG_DIR[$name]}/package.json" | tr '\n' ' ')
          done
          # the publish order: every package after its dependencies
          ORDER=()
          declare -A PLACED=()
          while [ ${#ORDER[@]} -lt ${#NAMES[@]} ]; do
            progressed=
            for name in "${NAMES[@]}"; do
              if [ -n "${PLACED[$name]:-}" ]; then continue; fi
              ready=1
              for dep in ${PKG_DEPS[$name]}; do
                if [ -z "${PLACED[$dep]:-}" ]; then ready=; fi
              done
              if [ -n "$ready" ]; then ORDER+=("$name"); PLACED[$name]=1; progressed=1; fi
            done
            if [ -z "$progressed" ]; then
              echo "::error::circular dependency among the packages to publish (${NAMES[*]})"
              exit 1
            fi
          done
          FAILED=()
          declare -A FAILED_SET=()
          for name in "${ORDER[@]}"; do
            v=${PKG_VERSION[$name]}
            echo "::group::$name@$v"
            blocked=
            for dep in ${PKG_DEPS[$name]}; do
              if [ -n "${FAILED_SET[$dep]:-}" ]; then blocked=$dep; fi
            done
            if [ -n "$blocked" ]; then
              echo "::endgroup::"
              echo "::error::$name@$v not published: the publish of $blocked@${PKG_VERSION[$blocked]} failed, and $name depends on it"
              FAILED+=("$name"); FAILED_SET[$name]=1
              continue
            fi
            if publish_one "$name" "${PKG_RELEASE[$name]}" "${PKG_DIR[$name]}" "$v" "${PKG_TAG[$name]}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::the publish of $name@$v failed"
              FAILED+=("$name"); FAILED_SET[$name]=1
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::not published: ${FAILED[*]} (re-run the failed jobs: the published versions are skipped)"
            exit 1
          fi
