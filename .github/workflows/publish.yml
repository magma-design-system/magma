# Publishes the packages to npm. Runs on main (all packages) and on dev
# (opted-in packages only, see the dev-publish matrix flag) once every CI
# workflow of the commit has succeeded (fan-in via workflow_run), or manually
# via workflow dispatch. A package is published only when its version
# differs from the latest one on the npm registry.
#
# On beta the release commits no version bump: the version of magma and its
# companions is the one of the `magma@*` tag on the commit, written into the
# manifests right before publishing (scripts/set-release-version.sh). There
# the gate also waits for the `stencil release` run of the commit, which
# creates that tag, and the packages without a release tag are not published.
#
# Authentication uses npm trusted publishing (OIDC): no NPM_TOKEN secret,
# the npm CLI exchanges the GitHub Actions OIDC token for short-lived
# credentials and attaches provenance automatically. Each package must
# have this repo + workflow registered as trusted publisher on npmjs.com.
name: publish

on:
  workflow_run:
    # `stencil release` only matters on beta, where it creates the tag the
    # version is read from (the gate ignores it on the other branches)
    workflows: [design-tokens, icons, identity, styles, svg-icons, stencil, stencil release]
    types: [completed]
    # main = stable releases; beta = magma prerelease channel (2.0.0-beta.N ->
    # npm dist-tag 'beta'); dev = stable releases of the packages that opt in
    # via the dev-publish matrix flag (icons, svg-icons)
    branches: [main, beta, dev]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        default: all
        options:
          - all
          - design-tokens
          - icons
          - identity
          - styles
          - svg-icons
          - magma
          - magma-react
          - magma-angular

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
      run-ids: ${{ steps.check.outputs.run-ids }}
    steps:
      - name: Check that all CI workflows of the commit are green
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.sha }}"
            if [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ inputs.package }}" = "all" ]; then
              echo "::error::manual publish from a branch other than main requires a specific package"
              exit 1
            fi
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "${{ github.event.workflow_run.name }}" = "stencil release" ] && \
               [ "${{ github.event.workflow_run.head_branch }}" != "beta" ]; then
              echo "::notice::the stencil release run only gates publishing on beta, nothing to do"
              exit 0
            fi
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::warning::workflow '${{ github.event.workflow_run.name }}' did not succeed, skipping publish"
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # latest push-event run of each watched CI workflow for this commit
          # (allowlist in lockstep with on.workflow_run.workflows above). The
          # other release workflows and any other workflow are excluded: their
          # completion does not re-trigger publish, so waiting on one still in
          # progress would lose the publish. On beta `stencil release` is watched
          # too, because it creates the tag the version is read from: whichever of
          # it and the CI finishes last runs the publish. pull_request runs are
          # excluded because they share the head SHA when a PR from dev is open,
          # produce no artifacts, and could win the max_by(.id) pick over the
          # artifact-bearing push run.
          WATCHED='["design-tokens", "icons", "identity", "styles", "svg-icons", "stencil"]'
          if [ "${{ github.event.workflow_run.head_branch || github.ref_name }}" = "beta" ]; then
            WATCHED=$(echo "$WATCHED" | jq -c '. + ["stencil release"]')
          fi
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
            | jq --argjson watched "$WATCHED" '[.workflow_runs[] | select(.event == "push" and (.name as $n | $watched | index($n)))] | group_by(.name) | map(max_by(.id))')
          echo "$RUNS" | jq -r '.[] | "\(.name): \(.status) (\(.conclusion))"'
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            # a skipped release run (e.g. a chore(release) push) created no tag, it is not a failure
            FAILED=$(echo "$RUNS" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and (.name != "stencil release" or .conclusion != "skipped"))] | length')
            if [ "$PENDING" -gt 0 ]; then
              echo "::notice::$PENDING CI workflow(s) still running, the last one to finish will re-run this check"
              exit 0
            fi
            if [ "$FAILED" -gt 0 ]; then
              echo "::warning::$FAILED CI workflow(s) did not succeed, skipping publish"
              exit 0
            fi
          fi
          echo "run-ids=$(echo "$RUNS" | jq -c 'map({(.name): .id}) | add // {}')" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [gate]
    if: ${{ needs.gate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read # checkout
      actions: read # download build artifacts from the CI runs
    env:
      # released in lockstep under the magma@* tag: the same set as the
      # working-directory + version-sync-paths of stencil.release.yml (beta)
      # and of the magma entry of release.yml (main)
      MAGMA_LOCKSTEP_MANIFESTS: >-
        projects/stencil/package.json
        projects/stencil-react/package.json
        projects/stencil-angular/magma-angular/package.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: design-tokens
            directory: projects/design-tokens
            workflow: design-tokens
            artifact: design-tokens-build
            artifact-path: projects/design-tokens/dist
          - component: icons
            directory: projects/icons
            workflow: icons
            artifact: icons-build
            artifact-path: projects
            # stable releases also ship from dev (see icons.release.yml)
            dev-publish: true
          - component: identity
            directory: projects/identity
            workflow: identity
            artifact: identity-build
            artifact-path: projects/identity/dist
          - component: styles
            directory: projects/styles
            workflow: styles
            artifact: styles-build
            artifact-path: projects
          - component: svg-icons
            directory: projects/svg-icons
            workflow: svg-icons
            artifact: svg-icons-build
            artifact-path: projects/svg-icons/dist
            # stable releases also ship from dev (see svg-icons.release.yml)
            dev-publish: true
          - component: magma
            directory: projects/stencil
            workflow: stencil
            artifact: stencil-build
            artifact-path: projects
            # on beta the version comes from the magma@* tag on the commit
            release-tag: magma
          - component: magma-react
            directory: projects/stencil-react
            workflow: stencil
            artifact: stencil-react-build
            artifact-path: projects/stencil-react/dist
            release-tag: magma
          - component: magma-angular
            # publishes from the build output (ng-packagr layout), so the
            # version is read from the source package.json
            directory: projects/stencil-angular/dist/magma-angular
            version-file: projects/stencil-angular/magma-angular/package.json
            workflow: stencil
            artifact: stencil-angular-build
            artifact-path: projects/stencil-angular/dist
            release-tag: magma
    concurrency: publish-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Check whether a new version needs publishing
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          # only opted-in packages publish from dev. This guard must run before
          # the npm view check: a dev version missing from npm (e.g. a magma
          # alpha bumped on dev but released elsewhere) must never publish here
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "dev" ] && [ "${{ matrix.dev-publish || false }}" != "true" ]; then
            echo "::notice::${{ matrix.component }} does not publish from dev, skipping"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.package }}" != "all" ] && [ "${{ inputs.package }}" != "${{ matrix.component }}" ]; then
            echo "::notice::${{ matrix.component }} not selected, skipping"
            exit 0
          fi
          if [ "$BRANCH" = "beta" ]; then
            # beta commits no version bump: the version is the one of the
            # release tag on the commit, and a commit without it publishes nothing
            if [ -z "${{ matrix.release-tag }}" ]; then
              echo "::notice::${{ matrix.component }} does not publish from beta, skipping"
              exit 0
            fi
            # an annotated tag is listed twice: as the tag object and, peeled
            # with ^{}, as the commit it points to
            RELEASE_TAG=$(git ls-remote --tags origin "refs/tags/${{ matrix.release-tag }}@*" \
              | awk -v sha="${{ needs.gate.outputs.sha }}" '$1 == sha { sub(/^refs\/tags\//, "", $2); sub(/\^\{\}$/, "", $2); print $2 }' \
              | sort -u | tail -n 1)
            if [ -z "$RELEASE_TAG" ]; then
              echo "::notice::no ${{ matrix.release-tag }}@* release tag on ${{ needs.gate.outputs.sha }}, skipping"
              exit 0
            fi
            TO_BE_PUBLISHED_V="${RELEASE_TAG##*@}"
            echo "release-version=$TO_BE_PUBLISHED_V" >> "$GITHUB_OUTPUT"
          else
            TO_BE_PUBLISHED_V="$(jq -r '.version' "${{ matrix.version-file || format('{0}/package.json', matrix.directory) }}")"
          fi
          echo "VERSION TO BE PUBLISHED ${TO_BE_PUBLISHED_V}"
          # npm view of a missing version exits 0 with empty output, so test the output
          PUBLISHED="$(npm view "@maggioli-design-system/${{ matrix.component }}@${TO_BE_PUBLISHED_V}" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "::notice::@maggioli-design-system/${{ matrix.component }}@${TO_BE_PUBLISHED_V} already published, skipping"
            exit 0
          fi
          # A version can be missing from npm without a fresh build to publish
          # (manual bump merged to a branch where this package's CI does not run,
          # or a chore(release) push where its build was path-filtered out):
          # skip with a warning instead of failing the artifact download.
          RUN_ID='${{ fromJSON(needs.gate.outputs.run-ids)[matrix.workflow] }}'
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::warning::${{ matrix.component }}@${TO_BE_PUBLISHED_V} is not on npm but the '${{ matrix.workflow }}' workflow has no run for this commit, skipping"
            exit 0
          fi
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?name=${{ matrix.artifact }}" --jq '.total_count')
          if [ "$ARTIFACTS" = "0" ]; then
            echo "::warning::${{ matrix.component }}@${TO_BE_PUBLISHED_V} is not on npm but run ${RUN_ID} produced no '${{ matrix.artifact }}' artifact, skipping"
            exit 0
          fi
          # dist-tag from the semver prerelease identifier: 2.0.0-alpha.0 -> alpha,
          # non-alphabetic identifier -> next, stable -> latest
          case "$TO_BE_PUBLISHED_V" in
            *-*)
              TAG="${TO_BE_PUBLISHED_V#*-}"
              TAG="${TAG%%.*}"
              case "$TAG" in ''|*[!a-zA-Z]*) TAG=next ;; esac
              ;;
            *) TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.ver.outputs.proceed == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ steps.ver.outputs.proceed == 'true' }}
        run: npm ci --prefer-offline
      - name: Download the build artifact from the CI run
        if: ${{ steps.ver.outputs.proceed == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          run-id: ${{ fromJSON(needs.gate.outputs.run-ids)[matrix.workflow] }}
          github-token: ${{ github.token }}
      - name: Write the release tag version into the manifests (beta)
        if: ${{ steps.ver.outputs.proceed == 'true' && steps.ver.outputs.release-version != '' }}
        env:
          V: ${{ steps.ver.outputs.release-version }}
          MANIFEST: ${{ matrix.directory }}/package.json
        run: |
          # a chore(release) commit (release flow before the tag-only beta) already carries it
          if [ "$(jq -r '.version' "$MANIFEST")" = "$V" ]; then
            echo "$MANIFEST already at $V"
            exit 0
          fi
          # the lockstep sources first, so every companion pins magma to $V, then
          # the published manifest itself (the ng-packagr output for magma-angular)
          # shellcheck disable=SC2086 # the list is split on purpose
          ./scripts/set-release-version.sh "$V" $MAGMA_LOCKSTEP_MANIFESTS "$MANIFEST"
      - name: Publish to npm
        if: ${{ steps.ver.outputs.proceed == 'true' }}
        working-directory: ${{ matrix.directory }}
        run: npm publish --access public --tag "${{ steps.ver.outputs.tag }}"
