# Reusable CI pipeline for a workspace package: change detection -> build -> test.
# Publishing to npm is handled by the publish workflow (publish.yml): the
# release and the npm publish of every package, from main, in one run.
#
# Path filtering happens in the `changes` job instead of the caller's trigger:
# GitHub evaluates trigger `paths` only on the first 300 files of the diff, so
# big merges silently skip workflows. Every pipeline also counts the root
# package.json, package-lock.json and .nvmrc, this file and the workflow that
# calls it (see the `changes` job).
#
# The callers run on pull requests and in the merge queue. A commit landed by
# the queue keeps the SHA of its merge-group run, so that run is the CI of the
# commit on main (publish.yml checks it, deploy-site.yml reuses its
# artifact) and nothing runs again on the push.
#
# The build job keeps the Nx cache under a key of its own Nx project and commit,
# so each build saves one (a key shared by every job of a commit was saved by
# the first to finish, lint, and held no build) and the next push of the branch
# restores the latest; the wrapper jobs of stencil.yml restore the stencil one.
name: package-pipeline

on:
  workflow_call:
    inputs:
      path:
        description: Glob of the project files; build/test run only when they changed
        type: string
        required: true
      extra-path:
        description: Extra path glob that also triggers this pipeline (e.g. a file this project verifies but does not own)
        type: string
        default: ''
      nx-project:
        description: Nx project name to build (empty = no build job)
        type: string
        default: ''
      artifact-paths:
        description: Paths uploaded as build artifact (multiline)
        type: string
        default: ''
      artifact-download-path:
        description: Destination path when downloading the build artifact (least common ancestor of artifact-paths)
        type: string
        default: '.'
      run-tests:
        description: Run `npm run test` in test-working-directory
        type: boolean
        default: false
      test-working-directory:
        description: Directory where tests run
        type: string
        default: ''
      install-playwright-browsers:
        description: Install (and cache) the Playwright Chromium used by the vitest browser tests
        type: boolean
        default: false
      run-storybook-tests:
        description: Also run `npm run test-storybook` (the Vitest `storybook` project) in test-working-directory
        type: boolean
        default: false
      build-storybook:
        description: Also run `npm run storybook.build` in test-working-directory (the static Storybook the deploy site workflow publishes)
        type: boolean
        default: false
    outputs:
      changed:
        description: Whether files matching `path`, `extra-path`, the root toolchain (package.json, package-lock.json, .nvmrc), this pipeline or the calling workflow changed in this event; always true in a merge group
        value: ${{ jobs.changes.outputs.changed }}

env:
  # Nx 23 keeps the task cache and the database that indexes it in ~/.nx/<id>/,
  # shared by every checkout of the workspace: here both go under .nx, where
  # actions/cache saves and restores them together (they must move together: the
  # database rows index the cache directory)
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data
  # Nx drops the least recently used entries past this size (default: 10% of the
  # disk), so a cache restored and saved run after run stays small
  NX_MAX_CACHE_SIZE: 300MB

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A merge group runs every pipeline. Its ref is the temporary branch of the merge queue
      # (gh-readonly-queue/main/...), so the `base` below would diff it against itself and find
      # nothing: every build and test job would be skipped, and a skipped job satisfies a
      # required check, so the queue would merge untested code into main.
      changed: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.project }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.event_name != 'merge_group' }}
      # The workflow file that calls this one (stencil.yml, studio.yml, ...), for the filter
      # below. In a called workflow the github context is the caller's ("the github context is
      # always associated with the caller workflow", GitHub docs, Reusing workflows), and
      # github.workflow_ref names it as <owner>/<repo>/<path>@<ref> (GitHub docs, Contexts
      # reference). A value of any other shape fails the job instead of filtering on a guess.
      - name: Path of the calling workflow
        if: ${{ github.event_name != 'merge_group' }}
        id: caller
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          path="${WORKFLOW_REF#*/*/}"
          path="${path%%@*}"
          if [[ ! "$path" =~ ^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$ ]]; then
            echo "::error::cannot read the calling workflow from github.workflow_ref '$WORKFLOW_REF'"
            exit 1
          fi
          echo "calling workflow: $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        if: ${{ github.event_name != 'merge_group' }}
        id: filter
        with:
          # Besides the files of its project, every pipeline counts the root package.json,
          # package-lock.json and .nvmrc: they are the toolchain every package builds and tests
          # with (the Node version, the installed version of every dependency: vitest,
          # playwright, typescript, stencil). A pull request that changes only those, a Renovate
          # bump, otherwise skips every build and test job on the pull request, and a skipped job
          # satisfies a required check: it looks green and fails for the first time in the merge
          # queue, taking the pull requests grouped behind it out too (#1291, #1369). This file
          # and the workflow that calls it count too, so that a change to either runs the
          # pipeline before the queue. The patterns match from the root (picomatch with `dot`
          # only, no `matchBase`, in dorny/paths-filter src/filter.ts): the package.json of a
          # project counts only through `path`.
          filters: |
            project:
              - '${{ inputs.path }}'
              ${{ inputs.extra-path && format('- ''{0}''', inputs.extra-path) || '' }}
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/_package-pipeline.yml'
              - '${{ steps.caller.outputs.path }}'

  build:
    needs: [changes]
    if: ${{ needs.changes.outputs.changed == 'true' && inputs.nx-project != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Nx cache
        uses: actions/cache@v6
        with:
          path: .nx
          key: nx-${{ inputs.nx-project }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ inputs.nx-project }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline
      - run: npx nx run ${{ inputs.nx-project }}:build
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ format('{0}-build', inputs.nx-project) }}
          path: ${{ inputs.artifact-paths }}
          retention-days: 1
          include-hidden-files: true

  test:
    needs: [changes, build]
    if: >-
      ${{ !cancelled() && inputs.run-tests &&
          needs.changes.outputs.changed == 'true' &&
          (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      # the browser revision is pinned by the playwright version: the key reads it
      # from the lockfile instead of hashing the whole file, which changes with
      # every bump of any dependency and kept a dozen copies of the same browser
      - name: Read the Playwright version
        if: ${{ inputs.install-playwright-browsers }}
        id: playwright
        run: |
          echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers cache
        if: ${{ inputs.install-playwright-browsers }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # no-op for the browser when cached, still installs the system libraries
      - if: ${{ inputs.install-playwright-browsers }}
        run: npx playwright install --with-deps chromium
      - if: ${{ inputs.nx-project != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ format('{0}-build', inputs.nx-project) }}
          path: ${{ inputs.artifact-download-path }}
      - working-directory: ${{ inputs.test-working-directory }}
        run: npm run test
      # the stories render the dist of the build artifact in the same Playwright Chromium;
      # vitest runs once in CI, no Storybook server is started
      - if: ${{ inputs.run-storybook-tests }}
        working-directory: ${{ inputs.test-working-directory }}
        run: npm run test-storybook
      # the play functions run the stories in Vitest, never the production
      # build: a story that breaks only `storybook build` fails here, before
      # the merge, instead of in the deploy
      - if: ${{ inputs.build-storybook }}
        working-directory: ${{ inputs.test-working-directory }}
        run: npm run storybook.build
