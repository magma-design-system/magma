name: stencil

on:
  pull_request:
  # the merge queue of main runs the required checks here (docs/WORKFLOW.md, rule 1), on
  # the very commit it then lands on main: this run is the CI of that commit, and
  # nothing runs again on the push
  merge_group:

concurrency:
  # one run per ref: a newer push cancels the superseded run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nx 23 keeps the task cache and the database that indexes it in ~/.nx/<id>/,
  # shared by every checkout of the workspace: here both go under .nx, where
  # actions/cache saves and restores them together (they must move together: the
  # database rows index the cache directory)
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data
  # Nx drops the least recently used entries past this size (default: 10% of the
  # disk), so a cache restored and saved run after run stays small
  NX_MAX_CACHE_SIZE: 300MB

jobs:
  # Builds stencil and runs the e2e tests; its build artifact
  # also feeds the react/angular builds and tests below
  magma:
    uses: ./.github/workflows/_package-pipeline.yml
    with:
      path: projects/stencil/**
      # the react/angular wrappers are built and tree-shake-checked by this workflow, the
      # shared agent guides of docs/agents ship inside the packages and are checked by
      # usage-docs, and the consumer lint of projects/lint is compiled into magma's dist/lint
      extra-path: '{projects/stencil-*/**,docs/agents/**,projects/lint/**}'
      nx-project: stencil
      artifact-paths: |
        projects/design-tokens/dist
        projects/styles/dist
        projects/svg-icons/dist
        projects/stencil/dist
        projects/stencil/src/components.d.ts
        projects/stencil/src/fixtures
        projects/stencil/www
        projects/stencil/assets
        projects/stencil-react/src
        projects/stencil/loader
        projects/stencil/AGENTS.md
        projects/stencil/agents
        projects/stencil-angular/magma-angular/src/stencil-generated
      artifact-download-path: projects
      run-tests: true
      # the browser tests need the Playwright Chromium
      install-playwright-browsers: true
      test-working-directory: projects/stencil
      # play functions and a11y checks of the stories (Vitest project `storybook`)
      run-storybook-tests: true
      # the static Storybook that deploy-storybook.yml publishes once this job is green
      build-storybook: true

  magma-react:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # the Nx cache `magma / build` saved in this run: stencil:build and the builds it
      # depends on come from it, so the wrapper build below runs its own task only
      - name: Restore the Nx cache of the stencil build
        uses: actions/cache/restore@v6
        with:
          path: .nx
          key: nx-stencil-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-stencil-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - run: npx nx run stencil-react:build
      # the browser revision is pinned by the playwright version, read from the
      # lockfile as in _package-pipeline.yml
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # no-op for the browser when cached, still installs the system libraries
      - run: npx playwright install --with-deps chromium
      # the wrapper against the real custom elements (browser) and its SSR modules (node)
      - run: npx nx run stencil-react:test
      - uses: actions/upload-artifact@v7
        with:
          name: stencil-react-build
          # rooted at the package directory (the common ancestor): dist plus the
          # agent docs, which publish.yml packs next to it (#809)
          path: |
            projects/stencil-react/dist
            projects/stencil-react/AGENTS.md
            projects/stencil-react/agents
          retention-days: 1
          include-hidden-files: true

  magma-angular:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # the Nx cache `magma / build` saved in this run: stencil:build and the builds it
      # depends on come from it, so the wrapper build below runs its own task only
      - name: Restore the Nx cache of the stencil build
        uses: actions/cache/restore@v6
        with:
          path: .nx
          key: nx-stencil-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-stencil-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - run: npx nx run stencil-angular:build
      # Vitest in jsdom through the Angular unit-test builder: no browser needed
      - run: npx nx run stencil-angular:test
      - uses: actions/upload-artifact@v7
        with:
          name: stencil-angular-build
          # without the test bundles the unit-test builder leaves behind
          path: |
            projects/stencil-angular/dist
            !projects/stencil-angular/dist/test-out
          retention-days: 1
          include-hidden-files: true

  # Guards SSR: every component must serialize through renderToString from
  # the hydrate build without error diagnostics (they are silent by design,
  # so a broken component would quietly ship wrong markup to SSR consumers).
  ssr:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - run: npx nx run stencil:check.ssr

  # Guards against component CSS referencing a token no layer publishes. An
  # unresolvable var() makes the declaration invalid at computed-value time, so the
  # property silently falls back to its initial value - which is how 129 box-shadow
  # declarations computed to `none` for five months without a single test failing
  # (#641). Reads the emitted token layer, so it needs the build artifact.
  tokens:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - run: npx nx run stencil:check.tokens

  # Guards the component usage docs against drift from the code: they ship as
  # examples.md / mistakes.md beside each component's AGENTS.md and agents copy
  # their examples verbatim. Every tag, attribute, value, slot, part, event and
  # custom property must exist in the built API and token layer, no example may
  # paint with a palette step or a raw radius (#815), and every member of the API
  # needs a description in its JSDoc (#829). The shared agent guides of docs/agents
  # follow the same rules (#1092). Reads
  # dist/documentation.json and the token layer, so it needs the build artifact.
  usage-docs:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - run: npx nx run stencil:check.usage-docs

  # Guards the public API snapshot: magma.api.txt lists every prop, event, method,
  # slot, part and documented custom property, one line each, so a PR that changes
  # the contract consumers rely on shows it as a short diff of that file (#843). The
  # build writes it; this fails when the committed copy differs from the built API.
  # Reads dist/documentation.json, so it needs the build artifact.
  api-snapshot:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - run: npx nx run stencil:check.api-snapshot

  # Guards the types of the tests and the stories: Vitest strips them and the build
  # compiles tsconfig.stencil.json, which leaves them out, so their errors showed only
  # in the editor (#946). Runs tsc on tsconfig.json, the editor's program; it imports
  # src/fixtures/icons.json and the svg-icons dist, so it needs the build artifact.
  types:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - run: npx nx run stencil:check.types

  # The consumer lint and the MCP server (projects/lint, #1102, #1107) ship inside
  # magma: stencil:build compiles them into dist/lint and runs lint:build first, as
  # an implicit dependency. Their tests run on fixtures cut from the real data, so
  # they need no artifact; lint:build comes from the Nx cache of `magma / build`.
  # A red job here is a red stencil run, which publish.yml refuses to release.
  consumer-lint:
    needs: [magma]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore the Nx cache of the stencil build
        uses: actions/cache/restore@v6
        with:
          path: .nx
          key: nx-stencil-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-stencil-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline
      - run: npx nx run lint:test

  # Guards the tree-shaking of the three published packages: a consumer that
  # imports one component must not end up shipping all 115. Needs all three
  # builds, so it runs last.
  treeshaking:
    needs: [magma, magma-react, magma-angular]
    if: ${{ needs.magma.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - uses: actions/download-artifact@v8
        with:
          name: stencil-build
          path: projects
      - uses: actions/download-artifact@v8
        with:
          name: stencil-react-build
          path: projects/stencil-react
      - uses: actions/download-artifact@v8
        with:
          name: stencil-angular-build
          path: projects/stencil-angular/dist
      - run: npx nx run stencil:check.treeshaking
