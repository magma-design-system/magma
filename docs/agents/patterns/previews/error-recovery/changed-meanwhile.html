<div class="grid gap-between-sections">
  <mds-text typography="page" tag="h1">Modifica pratica</mds-text>
  <form class="@container grid max-w-form gap-content-actions">
    <div class="grid gap-between-fields">
      <mds-input-field label="Oggetto">
        <mds-input value="Rinnovo concessione suolo pubblico"></mds-input>
      </mds-input-field>
      <mds-input-field label="Durata in giorni">
        <mds-input value="120"></mds-input>
      </mds-input-field>
      <mds-banner variant="error" tone="strong" headline="Modifiche non salvate">
        <mds-text>
          Anna Rossi ha modificato la pratica alle 10:42, dopo che l'hai aperta. Non è stato salvato
          nulla e le tue modifiche sono ancora qui: guarda le sue prima di salvare.
        </mds-text>
      </mds-banner>
    </div>
    <div class="flex justify-end gap-inline @max-actions:flex-col @max-actions:*:self-stretch">
      <mds-button type="button" variant="dark" tone="outline">Annulla</mds-button>
      <mds-button>Salva</mds-button>
    </div>
  </form>
</div>
