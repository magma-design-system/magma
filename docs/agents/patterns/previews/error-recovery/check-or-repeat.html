<!--
try: Press Invia: the connection drops, Invia waits while the application asks the server what happened, then the error above the row says nothing left, so Invia can send it once.
height: 560
-->
<div class="grid gap-between-sections">
  <mds-text typography="page" tag="h1" data-stage>Nuova comunicazione</mds-text>
  <form id="form" class="@container grid max-w-form gap-content-actions">
    <div class="grid gap-between-fields">
      <mds-input-field label="Destinatario" data-stage>
        <mds-input type="email" value="m.bianchi@pec.esempio.it"></mds-input>
      </mds-input-field>
      <mds-input-field label="Oggetto" data-stage>
        <mds-input value="Documenti mancanti, pratica 2026/0412"></mds-input>
      </mds-input-field>
      <mds-banner id="error" variant="error" tone="strong" headline="Comunicazione non inviata" class="hidden">
        <mds-text>
          La connessione si è interrotta durante l'invio, e dal controllo risulta che non è partita.
          Quello che hai scritto è qui: inviala di nuovo, arriverà una volta sola.
        </mds-text>
      </mds-banner>
    </div>
    <div class="flex justify-end gap-inline @max-actions:flex-col @max-actions:*:self-stretch">
      <mds-button type="button" variant="dark" tone="outline" data-stage>Annulla</mds-button>
      <mds-button id="send">Invia</mds-button>
    </div>
  </form>
</div>
<script>
  const send = document.getElementById('send');
  document.getElementById('form').addEventListener('submit', (event) => event.preventDefault());
  send.addEventListener('click', () => {
    send.await = true;
    setTimeout(() => {
      send.await = undefined;
      document.getElementById('error').classList.remove('hidden');
    }, 600);
  });
</script>
