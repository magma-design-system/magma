<!--
try: Look at Civico and CAP: two short fields of one address share a row, each half the column. Narrow the stage under 28rem: they take the whole column, one under the other.
-->
<form class="max-w-form">
  <fieldset class="field-group">
    <legend>Nuova residenza</legend>
    <mds-input-field label="Via">
      <mds-input value="Via Emilia"></mds-input>
    </mds-input-field>
    <mds-input-field label="Civico" short>
      <mds-input value="12/A"></mds-input>
    </mds-input-field>
    <mds-input-field label="CAP" short variant="error" message="Il CAP ha cinque cifre: ne mancano due.">
      <mds-input value="470"></mds-input>
    </mds-input-field>
    <mds-input-field label="Comune">
      <mds-input value="Santarcangelo di Romagna"></mds-input>
    </mds-input-field>
  </fieldset>
</form>
