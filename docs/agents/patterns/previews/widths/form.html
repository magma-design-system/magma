<!--
try: Look at the end of the form: it stops where the text above it stops, its fields take the whole column and their messages stay on one line. Narrow the stage: the column follows it.
-->
<div class="grid gap-between-groups">
  <div class="grid gap-title-content">
    <mds-text typography="page" tag="h1">Nuovo referente</mds-text>
    <mds-text typography="detail" tag="p">
      Il referente riceve le comunicazioni dell'ente sulla pratica e risponde a nome
      dell'azienda. Puoi cambiarlo in ogni momento dalla scheda dell'azienda.
    </mds-text>
  </div>
  <form class="grid max-w-form gap-between-fields">
    <mds-input-field label="Nome e cognome">
      <mds-input value="Marco Bianchi"></mds-input>
    </mds-input-field>
    <mds-input-field label="PEC" message="La posta certificata delle comunicazioni ufficiali.">
      <mds-input type="email" value="m.bianchi@pec.comune.esempio.it"></mds-input>
    </mds-input-field>
    <mds-input-field label="Ufficio" message="L'ufficio che segue la pratica per l'azienda.">
      <mds-input value="Ufficio tecnico"></mds-input>
    </mds-input-field>
    <div class="flex justify-end gap-inline">
      <mds-button variant="dark" tone="outline">Annulla</mds-button>
      <mds-button>Aggiungi</mds-button>
    </div>
  </form>
</div>
