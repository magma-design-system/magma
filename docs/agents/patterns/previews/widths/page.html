height: 520
whole-page: true

<mds-header menu="none">
  <mds-header-bar class="sticky">
    <mds-text typography="h6" tag="p">Servizi demografici</mds-text>
    <mds-button slot="nav" variant="dark" tone="text">Pratiche</mds-button>
    <mds-button slot="nav" variant="dark" tone="text">Archivio</mds-button>
  </mds-header-bar>
</mds-header>
<main class="page-frame grid gap-between-groups py-between-sections">
  <div class="grid gap-title-content">
    <mds-text typography="h3" tag="h1">Pratiche di residenza</mds-text>
    <mds-text typography="detail" tag="p">Le richieste degli ultimi trenta giorni, dalla più recente.</mds-text>
  </div>
  <mds-table class="w-full">
    <mds-table-header>
      <mds-table-header-cell label="Protocollo"></mds-table-header-cell>
      <mds-table-header-cell label="Richiedente"></mds-table-header-cell>
    </mds-table-header>
    <mds-table-body>
      <mds-table-row>
        <mds-table-cell><mds-text typography="detail">2026/0412</mds-text></mds-table-cell>
        <mds-table-cell><mds-text typography="detail">Giulia Bianchi</mds-text></mds-table-cell>
      </mds-table-row>
      <mds-table-row>
        <mds-table-cell><mds-text typography="detail">2026/0398</mds-text></mds-table-cell>
        <mds-table-cell><mds-text typography="detail">Luca Ferri</mds-text></mds-table-cell>
      </mds-table-row>
    </mds-table-body>
  </mds-table>
</main>
