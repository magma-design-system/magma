<!--
try: Look at the order of the list: the search form at the width of a form, then the summary that says which practices out of how many with Rimuovi i filtri, the table whose numbers are the links to each practice, and the pages under it.
-->
<div class="grid gap-between-groups">
  <form role="search" class="grid gap-between-fields">
    <div class="field-group max-w-form">
      <mds-input-field label="Cerca">
        <mds-input type="search" name="q" placeholder="Numero o oggetto"></mds-input>
      </mds-input-field>
      <mds-input-field label="Ufficio" short>
        <mds-input-select name="ufficio" value="anagrafe">
          <option value="">Tutti gli uffici</option>
          <option value="anagrafe">Anagrafe</option>
          <option value="stato-civile">Stato civile</option>
        </mds-input-select>
      </mds-input-field>
    </div>
    <mds-filter label="Stato" class="justify-self-start">
      <mds-filter-item label="Tutte" value="" count="44" selected></mds-filter-item>
      <mds-filter-item label="Nuove" value="nuova" count="8"></mds-filter-item>
      <mds-filter-item label="In lavorazione" value="in-lavorazione" count="14"></mds-filter-item>
      <mds-filter-item label="In attesa" value="in-attesa" count="6"></mds-filter-item>
      <mds-filter-item label="Chiuse" value="chiusa" count="16"></mds-filter-item>
    </mds-filter>
  </form>
  <div class="grid gap-between-fields">
    <div class="grid gap-title-content">
      <div class="flex flex-wrap items-center gap-inline">
        <mds-text typography="detail" tag="p" role="status">41-44 di 44 pratiche</mds-text>
        <mds-button variant="dark" tone="text" size="sm">Rimuovi i filtri</mds-button>
      </div>
      <mds-table sorting="external" class="w-full [&_mds-table-cell]:text-nowrap [&_mds-text]:text-nowrap">
        <mds-table-header>
          <mds-table-header-cell label="Numero" sortable sort-key="numero"></mds-table-header-cell>
          <mds-table-header-cell label="Oggetto"></mds-table-header-cell>
          <mds-table-header-cell label="Richiedente"></mds-table-header-cell>
          <mds-table-header-cell label="Stato"></mds-table-header-cell>
          <mds-table-header-cell label="Ricevuta il" sortable sort-key="ricevuta" direction="descending"></mds-table-header-cell>
        </mds-table-header>
        <mds-table-body>
          <mds-table-row>
            <mds-table-cell><mds-text typography="detail"><mds-link href="#">2026/0118</mds-link></mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Cambio di residenza</mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Giulia Bianchi</mds-text></mds-table-cell>
            <mds-table-cell><mds-badge variant="warning" label="In lavorazione"></mds-badge></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">24 febbraio 2026</mds-text></mds-table-cell>
          </mds-table-row>
          <mds-table-row>
            <mds-table-cell><mds-text typography="detail"><mds-link href="#">2026/0115</mds-link></mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Iscrizione anagrafica</mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Luca Ferri</mds-text></mds-table-cell>
            <mds-table-cell><mds-badge variant="success" label="Chiusa"></mds-badge></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">23 febbraio 2026</mds-text></mds-table-cell>
          </mds-table-row>
          <mds-table-row>
            <mds-table-cell><mds-text typography="detail"><mds-link href="#">2026/0112</mds-link></mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Certificato di residenza</mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Marco Rossi</mds-text></mds-table-cell>
            <mds-table-cell><mds-badge variant="success" label="Chiusa"></mds-badge></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">20 febbraio 2026</mds-text></mds-table-cell>
          </mds-table-row>
          <mds-table-row>
            <mds-table-cell><mds-text typography="detail"><mds-link href="#">2026/0109</mds-link></mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Cambio di indirizzo</mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Anna Conti</mds-text></mds-table-cell>
            <mds-table-cell><mds-badge variant="info" label="In attesa"></mds-badge></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">19 febbraio 2026</mds-text></mds-table-cell>
          </mds-table-row>
        </mds-table-body>
      </mds-table>
    </div>
    <mds-paginator pages="5" current-page="5" class="justify-self-start"></mds-paginator>
  </div>
</div>
