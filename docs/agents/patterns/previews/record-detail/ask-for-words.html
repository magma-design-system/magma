<!--
try: Press Richiedi documenti with the note empty: the field says what is missing and takes the focus, and the dialog stays open.
height: 640
whole-page: true
-->
<mds-header menu="none">
  <mds-header-bar>
    <mds-text typography="h6" tag="p">Servizi demografici</mds-text>
    <mds-button slot="nav" variant="dark" tone="text">Pratiche</mds-button>
    <mds-button slot="nav" variant="dark" tone="text">Contatti</mds-button>
  </mds-header-bar>
</mds-header>
<main class="page-frame grid gap-between-sections py-between-sections">
  <header class="grid gap-title-content">
    <mds-button href="#" icon="mi/baseline/arrow-back" variant="dark" tone="text" size="sm" class="justify-self-start">Pratiche</mds-button>
    <div class="flex flex-wrap items-start justify-between gap-inline">
      <div class="grid min-w-0 grow gap-title-content">
        <mds-text typography="caption" tag="p" class="text-fg-muted">Pratica 2026/0142</mds-text>
        <div class="flex flex-wrap items-center gap-inline">
          <mds-text typography="page" tag="h1" tabindex="-1">Cambio di residenza</mds-text>
          <mds-badge variant="warning" label="In lavorazione"></mds-badge>
        </div>
        <mds-text typography="detail" tag="p" class="text-fg-muted">Ufficio anagrafe, ricevuta il 3 marzo 2026</mds-text>
      </div>
      <div class="flex flex-wrap gap-inline">
        <mds-button variant="dark" tone="outline">Richiedi documenti</mds-button>
        <mds-button>Chiudi pratica</mds-button>
      </div>
    </div>
  </header>
</main>
<mds-modal id="dialogo" opened aria-label="Richiedi documenti">
  <mds-banner slot="window" variant="light" tone="box" dismissible headline="Richiedi documenti">
    <form id="richiesta" class="grid gap-between-fields" novalidate>
      <mds-text typography="detail" tag="p">Giulia Bianchi riceve la nota via PEC, e la pratica resta in attesa dei documenti.</mds-text>
      <mds-input-field label="Nota per la richiedente">
        <mds-input id="nota" type="textarea" name="nota" required></mds-input>
      </mds-input-field>
    </form>
    <mds-button id="annulla" slot="action" variant="dark" tone="outline">Annulla</mds-button>
    <mds-button slot="action" type="submit" form="richiesta">Richiedi documenti</mds-button>
  </mds-banner>
</mds-modal>
<script>
  const dialog = document.getElementById('dialogo');
  const form = document.getElementById('richiesta');
  const note = document.getElementById('nota');
  customElements.whenDefined('mds-input').then(() =>
    note.addValidator((value) => (value ? null : { required: 'Scrivi quali documenti mancano' })),
  );
  dialog.addEventListener('mdsModalClose', () => (dialog.opened = undefined));
  document.getElementById('annulla').addEventListener('click', () => dialog.close());
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!form.checkValidity()) note.setFocus();
  });
</script>
