<main class="grid gap-between-sections">
  <header class="@container flex flex-wrap items-start justify-between gap-inline">
    <div class="grid min-w-0 grow basis-actions gap-title-content">
      <mds-text typography="page" tag="h1">Richieste</mds-text>
      <mds-text typography="detail" tag="p" class="text-fg-muted">Le richieste che i cittadini inviano all'ufficio anagrafe.</mds-text>
    </div>
    <div class="flex gap-inline @max-actions:basis-full @max-actions:flex-col @max-actions:*:self-stretch">
      <mds-button variant="dark" tone="outline">Esporta</mds-button>
      <mds-button>Nuova richiesta</mds-button>
    </div>
  </header>
  <mds-text typography="detail" tag="p" role="status" data-stage>1-10 di 44 richieste</mds-text>
</main>
