try: Look at the empty list of Deleghe: the panel says what a delegation is for and offers the first one; Nuova delega stays in the header too, the one filled action of the page.

<div class="grid gap-between-sections">
  <div class="flex flex-wrap items-start justify-between gap-inline">
    <mds-text typography="page" tag="h1" class="min-w-0">Deleghe</mds-text>
    <mds-button>Nuova delega</mds-button>
  </div>
  <mds-zero>
    <mds-text slot="content" typography="part" tag="h2">Nessuna delega</mds-text>
    <mds-text slot="content" typography="detail" tag="p">
      Con una delega un familiare o un professionista presenta le richieste a tuo nome.
      Aggiungi la prima per iniziare.
    </mds-text>
    <mds-button slot="action" variant="primary" tone="outline">Nuova delega</mds-button>
  </mds-zero>
</div>
