try: Look at Dati personali and Residenza: the two groups stand 1000 apart, farther than the 600 between their fields, so each field reads with its own group.
-->

    <legend>Dati personali</legend>
    <mds-input-field label="Nome">

  </fieldset>
  <fieldset class="field-group">
    <legend>Residenza</legend>
    <mds-input-field label="Indirizzo">
      <mds-input value="Via Emilia 12"></mds-input>
    </mds-input-field>
    <mds-input-field label="Comune">
      <mds-input value="Santarcangelo di Romagna"></mds-input>
    </mds-input-field>
  </fieldset>
</form>
