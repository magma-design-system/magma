<!--
try: Look at the row of the confirmation: Elimina last, filled in red; Annulla before it, outlined, holds the focus, so Invio cancels.
height: 320
-->
<mds-modal opened aria-label="Eliminare la nota Sopralluogo del 12 marzo?">
  <mds-banner slot="window" variant="light" tone="box" dismissible headline="Eliminare la nota Sopralluogo del 12 marzo?">
    <mds-text>La nota viene cancellata e non si può recuperare.</mds-text>
    <mds-button slot="action" variant="dark" tone="outline" autofocus>Annulla</mds-button>
    <mds-button slot="action" variant="error" tone="strong">Elimina</mds-button>
  </mds-banner>
</mds-modal>
