<!--
try: Look at the list of Richieste opening for the first time: its place is a well as tall as the rows to come, with the spinner in the middle, aria-busy until the rows come.
-->
<div class="grid gap-between-sections">
  <mds-text typography="page" tag="h1">Richieste</mds-text>
  <!-- Magma gap: no skeleton; the well keeps the place of the rows, so the page does not jump when they come -->
  <div aria-busy="true" class="grid min-h-6000 place-items-center rounded-md bg-surface-muted">
    <mds-spinner running></mds-spinner>
  </div>
</div>
