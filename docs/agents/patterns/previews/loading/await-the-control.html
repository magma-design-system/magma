<!--
try: Press Salva: the button waits with its spinner and keeps the focus, a second press does nothing, and after three seconds it is ready again.
-->
<div class="grid gap-between-sections">
  <mds-text typography="page" tag="h1">Recapiti</mds-text>
  <form id="form" class="@container grid max-w-form gap-content-actions">
    <div class="grid gap-between-fields">
      <mds-input-field label="PEC">
        <mds-input type="email" value="giulia.bianchi@pec.it"></mds-input>
      </mds-input-field>
      <mds-input-field label="Telefono">
        <mds-input type="tel" value="0541 620 112"></mds-input>
      </mds-input-field>
    </div>
    <div class="flex justify-end gap-inline @max-actions:flex-col @max-actions:*:self-stretch">
      <mds-button type="button" variant="dark" tone="outline">Annulla</mds-button>
      <mds-button id="save">Salva</mds-button>
    </div>
  </form>
</div>
<script>
  const save = document.getElementById('save');
  document.getElementById('form').addEventListener('submit', (event) => {
    event.preventDefault();
    save.await = true;
    setTimeout(() => (save.await = undefined), 3000);
  });
</script>
