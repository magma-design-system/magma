<!--
try: Look at the dashboard while its panels load: in the well of a load, the spinner, a sentence that says what is happening and how far it is, and a bar that fills as the panels arrive.
-->
<div class="grid gap-between-sections">
  <mds-text typography="page" tag="h1" data-stage>Cruscotto</mds-text>
  <div aria-busy="true" class="grid min-h-6000 content-center justify-items-center gap-label-control rounded-md bg-surface-muted p-inset text-center">
    <mds-spinner running></mds-spinner>
    <mds-text typography="detail" tag="p">Caricamento dei riquadri del cruscotto: 7 di 12.</mds-text>
    <mds-progress
      class="w-full max-w-form"
      progress="0.58"
      steps="Inizio,Un quarto,Metà,Tre quarti,Fine"
      aria-label="Caricamento dei riquadri"
    ></mds-progress>
  </div>
</div>
