<!--
try: Type Ferr in Cerca: the field waits with its spinner while the three requests stay on screen, then the list narrows to the two that match, with what was searched marked in each.
-->
<div class="grid gap-between-sections">
  <mds-text typography="page" tag="h1">Richieste</mds-text>
  <div class="grid gap-between-groups">
    <form id="find" role="search" class="grid max-w-form">
      <mds-input-field label="Cerca per nome o numero">
        <mds-input id="search" type="search"></mds-input>
      </mds-input-field>
    </form>
    <div class="grid gap-title-content">
      <mds-text id="summary" typography="detail" tag="p" role="status" class="text-fg-muted">3 richieste</mds-text>
      <mds-table id="results" class="w-full">
        <mds-table-header>
          <mds-table-header-cell label="Protocollo"></mds-table-header-cell>
          <mds-table-header-cell label="Richiedente"></mds-table-header-cell>
        </mds-table-header>
        <mds-table-body>
          <mds-table-row>
            <mds-table-cell><mds-text typography="detail">2026/0412</mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Giulia Bianchi</mds-text></mds-table-cell>
          </mds-table-row>
          <mds-table-row>
            <mds-table-cell><mds-text typography="detail">2026/0398</mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Luca Ferri</mds-text></mds-table-cell>
          </mds-table-row>
          <mds-table-row>
            <mds-table-cell><mds-text typography="detail">2026/0371</mds-text></mds-table-cell>
            <mds-table-cell><mds-text typography="detail">Anna Ferrari</mds-text></mds-table-cell>
          </mds-table-row>
        </mds-table-body>
      </mds-table>
    </div>
  </div>
</div>
<script>
  const search = document.getElementById('search');
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');
  let pause;
  let latest = 0;
  // what was searched, marked in the text of a cell: built from text nodes, never from markup
  const mark = (text, query) => {
    const whole = text.dataset.text ?? (text.dataset.text = text.textContent);
    const at = query ? whole.toLowerCase().indexOf(query) : -1;
    if (at < 0) return void (text.textContent = whole);
    const marked = document.createElement('mark');
    marked.className = 'bg-warning-surface text-inherit';
    marked.textContent = whole.slice(at, at + query.length);
    text.replaceChildren(whole.slice(0, at), marked, whole.slice(at + query.length));
  };
  document.getElementById('find').addEventListener('submit', (event) => event.preventDefault());
  search.addEventListener('mdsInputChange', () => {
    clearTimeout(pause);
    pause = setTimeout(() => {
      const query = String(search.value ?? '').trim().toLowerCase();
      const asked = ++latest;
      search.await = true;
      results.setAttribute('aria-busy', 'true');
      setTimeout(() => {
        // a newer search has started: this answer is dropped
        if (asked !== latest) return;
        let shown = 0;
        for (const row of results.querySelectorAll('mds-table-row')) {
          const match = row.textContent.toLowerCase().includes(query);
          row.hidden = !match;
          if (match) shown++;
          for (const text of row.querySelectorAll('mds-text')) mark(text, query);
        }
        summary.textContent = shown === 1 ? '1 richiesta' : `${shown} richieste`;
        search.await = undefined;
        results.removeAttribute('aria-busy');
      }, 1500);
    }, 300);
  });
</script>
