<!--
try: Look at the question: it names the user, and the text says what follows; Annulla holds the focus, so Invio cancels, and Elimina utente stands last in red.
height: 340
-->
<mds-modal opened aria-label="Eliminare l'utente Mario Rossi?">
  <mds-banner slot="window" variant="light" tone="box" dismissible headline="Eliminare l'utente Mario Rossi?">
    <mds-text>
      Non potrà più accedere, e l'utente non si può recuperare. Le pratiche che ha seguito restano,
      a suo nome.
    </mds-text>
    <mds-button slot="action" variant="dark" tone="outline" autofocus>Annulla</mds-button>
    <mds-button slot="action" variant="error" tone="strong">Elimina utente</mds-button>
  </mds-banner>
</mds-modal>
