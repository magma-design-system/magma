<!--
try: Look at the question: it says how many notes go, and the button repeats it; Annulla holds the focus, so Invio cancels.
height: 320
-->
<mds-modal opened aria-label="Eliminare 12 note?">
  <mds-banner slot="window" variant="light" tone="box" dismissible headline="Eliminare 12 note?">
    <mds-text>Le 12 note selezionate vengono cancellate e non si possono recuperare.</mds-text>
    <mds-button slot="action" variant="dark" tone="outline" autofocus>Annulla</mds-button>
    <mds-button slot="action" variant="error" tone="strong">Elimina 12 note</mds-button>
  </mds-banner>
</mds-modal>
