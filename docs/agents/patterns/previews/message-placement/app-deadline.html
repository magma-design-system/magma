<!--
try: Close the dialog with its X, Esc or the backdrop: it means Resta collegato, as the button does; only Esci ends the session. Simula la scadenza opens it again.
height: 400
-->
<mds-button id="open" variant="dark" tone="outline" data-stage>Simula la scadenza</mds-button>
<mds-modal id="dialog" opened aria-label="La sessione sta per scadere">
  <mds-banner slot="window" variant="warning" tone="box" dismissible headline="La sessione sta per scadere">
    <mds-text>Tra 2 minuti la sessione scade per inattività, e le modifiche non salvate alla pratica vanno perse.</mds-text>
    <mds-button id="leave" slot="action" variant="warning" tone="outline">Esci</mds-button>
    <mds-button id="stay" slot="action" variant="warning" tone="strong" autofocus>Resta collegato</mds-button>
  </mds-banner>
</mds-modal>
<script>
  const dialog = document.getElementById('dialog');
  document.getElementById('open').addEventListener('click', () => (dialog.opened = true));
  document.getElementById('stay').addEventListener('click', () => (dialog.opened = false));
  document.getElementById('leave').addEventListener('click', () => (dialog.opened = false));
  // closing the dialog, with its X, Esc or the backdrop, means Resta collegato: the application extends the session here
  dialog.addEventListener('mdsModalClose', () => (dialog.opened = undefined));
</script>
