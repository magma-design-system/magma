<!--
try: Press Invia promemoria a tutti in the open menu of the course: the menu closes, and a toast that stays says how many were sent and offers to send the 2 that failed again.
height: 400
-->
<header class="flex flex-wrap items-start justify-between gap-inline">
  <div class="grid gap-title-content">
    <mds-text typography="page" tag="h1">Iscritti al corso</mds-text>
    <mds-text typography="detail" tag="p" class="text-fg-muted">6 iscritti, 2 senza conferma di presenza.</mds-text>
  </div>
  <mds-button id="actions" icon="mi/baseline/more-vert" variant="dark" tone="text" aria-label="Azioni del corso"></mds-button>
</header>
<mds-dropdown id="menu" target="#actions" placement="bottom-end" visible>
  <mds-button id="remind" icon="mi/baseline/send" variant="dark" tone="text" label="Invia promemoria a tutti"></mds-button>
</mds-dropdown>
<mds-toast-region>
  <mds-toast id="partial" variant="error" duration="0" dismissible>
    Promemoria inviati a 4 iscritti su 6, non a 2
    <mds-button id="retry" slot="action" size="sm" variant="error" tone="outline">Riprova per 2</mds-button>
  </mds-toast>
  <mds-toast id="sent" variant="success">Promemoria inviati anche a Bianchi Anna e Neri Paola</mds-toast>
</mds-toast-region>
<script>
  const menu = document.getElementById('menu');
  const partial = document.getElementById('partial');
  document.getElementById('remind').addEventListener('click', () => {
    menu.visible = false;
    partial.visible = true;
  });
  document.getElementById('retry').addEventListener('click', () => {
    partial.visible = undefined;
    document.getElementById('sent').visible = true;
  });
</script>
