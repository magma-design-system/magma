<!--
try: Look at the question: the note goes for good, so a dialog stops the person before anything happens, with the focus on Annulla. Press Elimina nota: the dialog closes, the note leaves the list, the practice keeps the rest, and a toast says so.
height: 440
-->
<div class="grid gap-title-content">
  <mds-text id="title" typography="page" tag="h1" tabindex="-1">Note della pratica 2026/0142</mds-text>
  <div class="grid" data-stage>
    <div class="flex items-center justify-between gap-inline">
      <mds-text>Telefonata del 5 marzo</mds-text>
      <mds-button id="more-telefonata" icon="mi/baseline/more-vert" variant="dark" tone="text" aria-label="Azioni della nota Telefonata del 5 marzo"></mds-button>
    </div>
    <div id="row-sopralluogo" class="flex items-center justify-between gap-inline">
      <mds-text>Sopralluogo del 12 marzo</mds-text>
      <mds-button id="more-sopralluogo" icon="mi/baseline/more-vert" variant="dark" tone="text" aria-label="Azioni della nota Sopralluogo del 12 marzo"></mds-button>
    </div>
  </div>
</div>
<mds-dropdown target="#more-sopralluogo" placement="bottom-end" data-stage>
  <mds-button id="delete" icon="mi/baseline/delete" variant="error" tone="text" label="Elimina nota"></mds-button>
</mds-dropdown>
<mds-modal id="dialog" opened aria-label="Eliminare la nota Sopralluogo del 12 marzo?">
  <mds-banner slot="window" variant="light" tone="box" dismissible headline="Eliminare la nota Sopralluogo del 12 marzo?">
    <mds-text>La nota viene cancellata e non si può recuperare; la pratica e i suoi allegati restano come sono.</mds-text>
    <mds-button id="cancel" slot="action" variant="dark" tone="outline" autofocus>Annulla</mds-button>
    <mds-button id="confirm" slot="action" variant="error" tone="strong">Elimina nota</mds-button>
  </mds-banner>
</mds-modal>
<mds-toast-region data-stage>
  <mds-toast id="toast">Nota Sopralluogo del 12 marzo eliminata</mds-toast>
</mds-toast-region>
<script>
  const dialog = document.getElementById('dialog');
  let deleted = false;
  document.getElementById('delete').addEventListener('click', () => (dialog.opened = true));
  document.getElementById('cancel').addEventListener('click', () => dialog.close());
  dialog.addEventListener('mdsModalClose', () => (dialog.opened = undefined));
  document.getElementById('confirm').addEventListener('click', () => {
    deleted = true;
    dialog.close();
  });
  // the button that opened the dialog is gone with its row: the focus goes to the title of the page
  dialog.addEventListener('mdsModalHide', () => {
    if (!deleted) return;
    deleted = false;
    document.getElementById('row-sopralluogo').remove();
    document.getElementById('title').focus();
    document.getElementById('toast').visible = true;
  });
</script>
