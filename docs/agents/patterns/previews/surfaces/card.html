<!--
try: Look at the related requests: each one is a card, whose edge tells where one ends and the next begins; the section around them has no surface of its own.
-->
<section class="grid gap-title-content">
  <mds-text typography="section" tag="h2">Pratiche collegate</mds-text>
  <div class="grid grid-cols-[repeat(auto-fill,minmax(14rem,1fr))] gap-between-containers">
    <mds-card>
      <mds-card-header>
        <mds-text typography="part" tag="h3">Iscrizione anagrafica</mds-text>
      </mds-card-header>
      <mds-card-content>
        <mds-text typography="detail" tag="p">Pratica 2026/0098, conclusa il 12 febbraio.</mds-text>
      </mds-card-content>
      <mds-card-footer>
        <mds-button variant="primary" tone="outline">Apri</mds-button>
      </mds-card-footer>
    </mds-card>
    <mds-card>
      <mds-card-header>
        <mds-text typography="part" tag="h3">Carta di identità</mds-text>
      </mds-card-header>
      <mds-card-content>
        <mds-text typography="detail" tag="p">Pratica 2026/0131, in attesa della foto.</mds-text>
      </mds-card-content>
      <mds-card-footer>
        <mds-button variant="primary" tone="outline">Apri</mds-button>
      </mds-card-footer>
    </mds-card>
  </div>
</section>
